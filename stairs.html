<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>말랑 무한계단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Chakra+Petch:wght@600;700&display=swap">
<style>
  :root{--ink:#f2eefc;--dim:#a79dc6;--mint:#5fe3b6;--pink:#ff6f9c;--gold:#ffd45e;--violet:#b58cff}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%;background:#121628;color:var(--ink);font-family:"Jua",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #cv{position:fixed;inset:0;width:100%;height:100%}
  .ctl{position:fixed;left:0;right:0;bottom:0;display:none;gap:12px;padding:14px 16px calc(14px + env(safe-area-inset-bottom));z-index:3}
  body.playing .ctl{display:flex}
  .ctl button{flex:1;height:84px;border:0;border-radius:22px;font:inherit;font-size:22px;color:#fff;cursor:pointer;
    box-shadow:0 6px 0 rgba(0,0,0,.35),0 10px 24px rgba(0,0,0,.3);transition:transform .06s}
  .ctl button:active,.ctl button.on{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
  .ctl small{display:block;font-size:12px;opacity:.75;font-family:"Chakra Petch"}
  #bTurn{background:linear-gradient(160deg,#b58cff,#7a55d9)}
  #bUp{background:linear-gradient(160deg,#5fe3b6,#26a77d)}
  .panel{position:fixed;inset:0;z-index:6;display:grid;place-items:center;background:rgba(10,8,24,.62);padding:16px}
  .panel[hidden]{display:none}
  .card{width:min(380px,100%);background:rgba(20,16,36,.94);border:1px solid rgba(255,255,255,.14);border-radius:22px;padding:22px 20px;text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .4s cubic-bezier(.2,1.5,.4,1)}
  @keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:none;opacity:1}}
  h1{margin:0;font-size:40px;font-weight:400;background:linear-gradient(90deg,#5fe3b6,#ffd45e,#ff6f9c);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 rgba(10,8,24,.35))}
  .big{font-size:56px;font-family:"Chakra Petch";color:var(--gold);line-height:1;margin:6px 0}
  .row{display:flex;justify-content:center;gap:14px;color:var(--dim);font-size:15px;margin-bottom:10px;flex-wrap:wrap}
  .row b{color:var(--ink);font-family:"Chakra Petch"}
  .go{width:100%;height:58px;border:0;border-radius:16px;font:inherit;font-size:22px;color:#06291f;cursor:pointer;
    background:linear-gradient(135deg,#5fe3b6,#9ff0d8);box-shadow:0 5px 0 #26a77d}
  .go:active{transform:translateY(3px);box-shadow:0 2px 0 #26a77d}
  .go small{font-size:13px;opacity:.6}
  .go.alt{background:rgba(255,255,255,.12);color:var(--ink);box-shadow:0 5px 0 rgba(0,0,0,.35);height:50px;font-size:19px;margin-top:10px}
  .new{display:inline-block;background:var(--pink);color:#fff;border-radius:8px;padding:2px 10px;font-size:14px;margin-bottom:6px;animation:pop .5s .2s backwards}
  .earn{color:var(--gold);font-size:18px;margin-bottom:4px}
  .mini{color:var(--dim);font-size:12.5px;font-family:system-ui,sans-serif;line-height:1.5}
  .mute{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;z-index:7;width:42px;height:42px;border-radius:12px;border:1px solid rgba(255,255,255,.18);
    background:rgba(20,16,36,.6);color:#fff;font-size:18px;cursor:pointer}

  /* 로비 */
  #lobby{position:fixed;inset:0;z-index:4;pointer-events:none;display:flex;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
  #lobby[hidden]{display:none}
  #lobby > *{pointer-events:auto}
  .topbar{display:flex;gap:8px;align-items:center;padding-right:54px;flex-wrap:wrap}
  .pill{background:rgba(20,16,36,.72);border:1px solid rgba(255,255,255,.16);border-radius:999px;padding:7px 14px;font-size:15px;color:var(--ink);text-decoration:none}
  .pill b{font-family:"Chakra Petch";color:var(--gold)}
  .ltitle{text-align:center;margin-top:14px;pointer-events:none}
  .ltitle .mini{color:#fff;opacity:.85;text-shadow:0 1px 3px rgba(0,0,0,.5);font-size:13px;margin-top:4px}
  .spacer{flex:1;pointer-events:none}
  .bottom{display:flex;flex-direction:column;gap:10px;width:min(420px,100%);margin:0 auto}
  .who{text-align:center;background:rgba(20,16,36,.72);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:8px 12px;font-size:18px}
  .who .mini{margin-top:2px}
  .rar{display:inline-block;border-radius:6px;padding:1px 7px;font-size:12px;color:#fff;margin-left:6px;vertical-align:middle;font-family:system-ui,sans-serif;font-weight:700}
  .menu{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
  .menu button{position:relative;height:66px;border-radius:16px;background:rgba(20,16,36,.8);border:1px solid rgba(255,255,255,.14);color:var(--ink);font:inherit;font-size:14px;cursor:pointer;padding:0}
  .menu button:active{transform:translateY(2px)}
  .menu .ic{display:block;font-size:22px;line-height:1.2}
  .menu small{display:block;font-size:10.5px;color:var(--dim);font-family:"Chakra Petch"}
  .dot{position:absolute;top:6px;right:8px;width:10px;height:10px;border-radius:50%;background:var(--pink);box-shadow:0 0 0 2px rgba(20,16,36,.8)}

  /* 시트 (캐릭터 · 펫 · 미션 · 뽑기) */
  .sheet{width:min(580px,100%);height:min(760px,calc(100vh - 32px));display:flex;flex-direction:column;background:rgba(20,16,36,.97);border:1px solid rgba(255,255,255,.14);border-radius:22px;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:pop .3s cubic-bezier(.2,1.4,.4,1);overflow:hidden}
  .sh-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;border-bottom:1px solid rgba(255,255,255,.08)}
  .sh-head h2{margin:0;font-weight:400;font-size:22px}
  .x{width:38px;height:38px;border-radius:12px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:18px;cursor:pointer}
  .sh-body{flex:1;overflow:auto;padding:12px 16px 20px}
  .sh-body h3{font-weight:400;font-size:17px;margin:6px 0 8px;color:var(--gold)}
  .btn{border:0;border-radius:12px;padding:9px 13px;font:inherit;font-size:15px;cursor:pointer;background:linear-gradient(135deg,#5fe3b6,#9ff0d8);color:#06291f;white-space:nowrap}
  .btn.alt{background:rgba(255,255,255,.12);color:var(--ink)}
  .btn:disabled{opacity:.4;cursor:default}
  .detail{display:flex;gap:12px;align-items:center;background:rgba(255,255,255,.05);border-radius:16px;padding:10px;margin-bottom:10px}
  .detail .dinfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:5px;align-items:flex-start}
  .dname{font-size:19px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
  .tabs button{border:0;border-radius:10px;padding:6px 12px;font:inherit;font-size:14px;background:rgba(255,255,255,.08);color:var(--ink);cursor:pointer}
  .tabs button.on{background:var(--mint);color:#06291f}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:7px}
  .tile{position:relative;border-radius:14px;background:rgba(255,255,255,.06);border:2px solid transparent;padding:3px 2px 5px;cursor:pointer;text-align:center;font:inherit;font-size:11px;color:var(--dim);display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
  .tile span{display:block;width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tile.sel{border-color:var(--mint);background:rgba(95,227,182,.12)}
  .tile .bd{position:absolute;top:3px;right:5px;font-size:11px}
  .tile .rd{position:absolute;top:5px;left:6px;width:7px;height:7px;border-radius:50%}
  .tile.pop{animation:pop .45s cubic-bezier(.2,1.6,.4,1) backwards}
  .pager{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:12px;font-family:"Chakra Petch"}
  .bar{width:100%;height:8px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:5px}
  .bar i{display:block;height:100%;background:linear-gradient(90deg,#5fe3b6,#ffd45e);border-radius:4px}
  .ms{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.05);margin-bottom:8px;border:2px solid transparent}
  .ms.on{border-color:var(--mint)}
  .ms.done{opacity:.5}
  .ms .t{flex:1;min-width:0;font-size:15px}
  .ms .acts{display:flex;flex-direction:column;gap:5px;align-items:flex-end}
  .pe{font-size:34px;width:46px;text-align:center}
  .pe.lock{filter:grayscale(1) brightness(.55)}
  .gbox{text-align:center;background:radial-gradient(circle at 50% 30%,rgba(255,212,94,.18),rgba(255,255,255,.04));border-radius:18px;padding:16px;margin-bottom:12px}
  .gicon{font-size:56px;animation:wob 2.4s ease-in-out infinite}
  .gicon.shake{animation:shk .5s}
  @keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.05)}}
  @keyframes shk{0%,100%{transform:none}20%{transform:rotate(-18deg) scale(1.15)}40%{transform:rotate(16deg) scale(1.2)}60%{transform:rotate(-12deg)}80%{transform:rotate(8deg)}}
  .gbtns{display:flex;gap:10px;justify-content:center;margin:10px 0 6px}
  .gbtns .btn{font-size:17px;padding:11px 18px}
  .unl{margin:4px 0 12px;padding:10px;border-radius:14px;background:rgba(255,212,94,.1)}
  .unl .grid{grid-template-columns:repeat(auto-fill,minmax(64px,1fr))}
  #toasts{position:fixed;top:calc(64px + env(safe-area-inset-top));left:0;right:0;z-index:9;display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;padding:0 16px}
  .toast{background:rgba(20,16,36,.94);border:1px solid rgba(255,212,94,.5);border-radius:14px;padding:9px 16px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.4);animation:tin .35s cubic-bezier(.2,1.4,.4,1),tout .4s 2.3s forwards;max-width:100%}
  .toast b{color:var(--gold);font-weight:400}
  @keyframes tin{0%{transform:translateY(-20px);opacity:0}100%{transform:none;opacity:1}}
  @keyframes tout{to{transform:translateY(-12px);opacity:0}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<button class="mute" id="mute" type="button" aria-label="소리 켜기/끄기">🔊</button>
<div class="ctl">
  <button type="button" id="bTurn">방향 전환<small>A · ㅁ</small></button>
  <button type="button" id="bUp">오르기<small>L · ㅣ</small></button>
</div>

<div id="lobby">
  <div class="topbar">
    <span class="pill">🪙 <b id="lCoin">0</b></span>
    <span class="pill">🏆 <b id="lBest">0</b></span>
    <a class="pill" href="./">← 목록</a>
  </div>
  <div class="ltitle">
    <h1>말랑 무한계단</h1>
    <div class="mini">같은 방향이면 <b>오르기</b>, 꺾이면 <b>방향 전환</b>!<br>말랑이를 콕 눌러 보세요</div>
  </div>
  <div class="spacer"></div>
  <div class="bottom">
    <div class="who"><span id="lName"></span><span id="lRar" class="rar"></span><div class="mini" id="lPet"></div></div>
    <button class="go" id="start" type="button">시작하기 <small>(Space)</small></button>
    <div class="menu">
      <button type="button" data-open="chars"><span class="ic">🎭</span>캐릭터<small id="lCnt"></small></button>
      <button type="button" data-open="pets"><span class="ic">🐾</span>펫<small id="lPetCnt"></small></button>
      <button type="button" data-open="missions"><span class="ic">📜</span>미션<i class="dot" id="lDot" hidden></i></button>
      <button type="button" data-open="gacha"><span class="ic">🎁</span>뽑기<small>🪙50</small></button>
    </div>
  </div>
</div>

<div class="panel" id="over" hidden>
  <div class="card">
    <div id="overNew"></div>
    <div style="color:var(--dim)" id="overWhy">떨어졌어요!</div>
    <div class="big" id="overScore">0</div>
    <div class="row"><span>최고 <b id="oBest">0</b></span><span>최대 콤보 <b id="oCombo">0</b></span></div>
    <div class="earn" id="oEarn"></div>
    <div class="mini" id="oEarnSub" style="margin-bottom:10px"></div>
    <div id="overUnl"></div>
    <button class="go" id="again" type="button">다시 오르기 <small>(Space)</small></button>
    <button class="go alt" id="toLobby" type="button">로비로 <small>(Esc)</small></button>
  </div>
</div>

<div class="panel" id="sheet" hidden>
  <div class="sheet">
    <div class="sh-head"><h2 id="shTitle"></h2><button class="x" id="shClose" type="button" aria-label="닫기">✕</button></div>
    <div class="sh-body" id="shBody"></div>
  </div>
</div>
<div id="toasts"></div>

<script>
(function () {
const cv = document.getElementById("cv"), g = cv.getContext("2d");
let W = 0, H = 0, DPR = 1;
function resize() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize); resize();

const $ = id => document.getElementById(id);
const TAU = Math.PI * 2, rnd = (a, b) => a + Math.random() * (b - a), clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const fmt = n => Number(n).toLocaleString("ko-KR");

/* ---------- 저장 데이터 ---------- */
let DB = {}; try { DB = JSON.parse(localStorage.getItem("mallang-stairs") || "{}") || {}; } catch (e) {}
DB.coins = DB.coins || 0; DB.best = DB.best || 0;
DB.owned = Array.isArray(DB.owned) ? DB.owned : [0];
DB.sel = DB.sel || 0;
DB.pets = DB.pets || {};
DB.pet = DB.pet === undefined ? -1 : DB.pet;
DB.ach = DB.ach || [];
DB.st = Object.assign({ games: 0, stairs: 0, earned: 0, zero: 0, timeouts: 0, pokes: 0, clutch: 0, dailyDone: 0, days: 0, streak50: 0, turns: 0, gacha: 0 }, DB.st || {});
const S = DB.st;
const OWN = new Set(DB.owned); OWN.add(0);
const save = () => { try { localStorage.setItem("mallang-stairs", JSON.stringify(DB)); } catch (e) {} };
const persist = () => { DB.owned = [...OWN]; save(); };

/* ---------- 소리 ---------- */
let AC = null, muted = !!DB.muted;
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (AC && AC.state === "suspended") AC.resume(); return AC; }
function tone(f, to, dur, type, vol, delay) {
  if (muted) return; const c = ac(); if (!c) return;
  const t = c.currentTime + (delay || 0), o = c.createOscillator(), v = c.createGain();
  o.type = type || "sine"; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur);
  v.gain.setValueAtTime(vol || .1, t); v.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(v); v.connect(c.destination); o.start(t); o.stop(t + dur + .02);
}
const jingle = () => [659, 784, 988, 1319].forEach((f, i) => tone(f, 0, .22, "triangle", .09, i * .07));
$("mute").textContent = muted ? "🔇" : "🔊";
$("mute").onclick = () => { muted = !muted; DB.muted = muted; save(); $("mute").textContent = muted ? "🔇" : "🔊"; };

/* =========================================================
   캐릭터 500종
   - 일반 400: 몸 색 20 × 모자 20 (코인 구매 · 뽑기)
   - 조건 80 : 특별 스킨 4종 × 모자 20 (기록 달성)
   - 히든 20 : 비밀 조건
   ========================================================= */
const COLORS = [
  ["민트", 160, 65, 60], ["딸기", 350, 80, 68], ["레몬", 52, 90, 62], ["포도", 270, 55, 62], ["소다", 195, 80, 62],
  ["복숭아", 20, 90, 74], ["라임", 90, 65, 55], ["블루베리", 230, 60, 60], ["체리", 0, 75, 55], ["코코아", 25, 40, 45],
  ["바닐라", 45, 70, 86], ["솜사탕", 320, 75, 78], ["바다", 210, 75, 48], ["숲", 140, 45, 40], ["노을", 12, 85, 60],
  ["라벤더", 255, 60, 78], ["귤", 32, 95, 58], ["먹물", 240, 10, 30], ["하늘", 200, 85, 78], ["장미", 335, 65, 50],
];
const HATS = ["실크햇", "새싹", "리본", "비니", "야구모자", "고양이귀", "토끼귀", "꽃핀", "파티모자", "더듬이",
  "요리사모자", "별핀", "프로펠러", "헤드폰", "마법사모자", "악마뿔", "바이킹", "산타모자", "천사링", "왕관"];
const RAR = {
  n: { name: "일반", c: "#7f89a8", bonus: 0, price: 40 },
  r: { name: "레어", c: "#3d9bff", bonus: 3, price: 100 },
  e: { name: "에픽", c: "#a64dff", bonus: 6, price: 250 },
  l: { name: "전설", c: "#ff8c1a", bonus: 10, price: 600 },
  c: { name: "조건", c: "#20a97c", bonus: 8 },
  h: { name: "히든", c: "#ff4f7a", bonus: 15 },
};
const CHARS = [];
COLORS.forEach((c, ci) => HATS.forEach((h, hi) => {
  const s = ci + hi, r = s < 10 ? "n" : s < 20 ? "r" : s < 30 ? "e" : "l";
  CHARS.push({ id: CHARS.length, name: `${c[0]} ${h}말랑`, kind: "normal", rar: r, price: RAR[r].price, col: [c[1], c[2], c[3]], hat: hi, fx: null });
}));
const SPECIAL = [
  { nm: "황금", fx: "gold", stat: "best", lab: "최고 기록", unit: "계단", ns: [10, 20, 30, 40, 50, 70, 90, 110, 130, 150, 180, 210, 250, 300, 350, 400, 500, 600, 800, 1000] },
  { nm: "무지개", fx: "rainbow", stat: "stairs", lab: "누적 계단", unit: "개", ns: [50, 100, 200, 300, 500, 700, 1000, 1300, 1600, 2000, 2500, 3000, 4000, 5000, 6500, 8000, 10000, 13000, 16000, 20000] },
  { nm: "네온", fx: "neon", stat: "games", lab: "플레이", unit: "판", ns: [1, 3, 5, 10, 15, 20, 30, 40, 50, 60, 75, 90, 110, 130, 150, 175, 200, 250, 300, 400] },
  { nm: "별빛", fx: "star", stat: "earned", lab: "누적 코인", unit: "개", ns: [10, 30, 60, 100, 150, 200, 300, 400, 500, 700, 900, 1200, 1500, 2000, 2500, 3000, 4000, 5000, 7000, 10000] },
];
SPECIAL.forEach(sp => HATS.forEach((h, hi) => CHARS.push({
  id: CHARS.length, name: `${sp.nm} ${h}말랑`, kind: "cond", rar: "c", fx: sp.fx, hat: hi, col: [0, 0, 50],
  stat: sp.stat, need: sp.ns[hi], cond: `${sp.lab} ${fmt(sp.ns[hi])}${sp.unit} 달성`,
})));
const statVal = k => k === "best" ? DB.best : (S[k] || 0);
const hiddenOwned = () => CHARS.filter(c => c.kind === "hidden" && OWN.has(c.id)).length;

const HIDDEN = [
  { n: "꽈당말랑", hint: "넘어지는 것도 연습이에요", how: "0계단에서 5번 넘어지기", ok: () => S.zero >= 5, col: [28, 70, 74], hat: 11 },
  { n: "럭키세븐말랑", hint: "행운의 숫자에서 멈춰 보세요", how: "정확히 77계단에서 게임 오버", ok: r => r && r.score === 77, col: [140, 70, 50], hat: 7 },

      let ok = false;

      if (ok) { OWN.add(ch.id); got.push(ch); changed = true; }
    }
    PETS.forEach((p, i) => { if (p.cond && !DB.pets[i] && p.cond()) { DB.pets[i] = 1; got.push({ pet: p }); changed = true; } });

  const pi = DB.pet;

/* ---------- 업데이트 ---------- */
function update(dt) {
  if (state === "play") {
    // 높이 올라갈수록 게이지가 빨리 닳아요
    const drain = (.2 + Math.min(.75, score * .0022)) * PK.drain;
    timeLeft -= drain * dt;
    if (timeLeft <= 0) {
      if (revives > 0) {                                 // 펫이 한 번 살려 줘요
        revives--; timeLeft = .6; shake = .2;
        const sx = stairs[pos].x * SW, sy = -pos * SH;
        texts.push({ x: sx, y: sy - 70, t: "💖 부활!", life: 1.2, max: 1.2, c: "#ff6f9c", s: 24 });
        burst(sx, sy - 20, 20, "#ff9fc0", 240);
        [523, 784, 1047].forEach((f, i) => tone(f, 0, .2, "triangle", .09, i * .06));
      } else { timeLeft = 0; gameOver("time"); }
    }
  }
  if (fall) { fall.t += dt; fall.vy += 900 * dt; fall.x += fall.vx * dt; fall.y += fall.vy * dt; fall.rot += face * 7 * dt; }
  hop = Math.max(0, hop - dt * 7);
  shake = Math.max(0, shake - dt);
  for (const f of fx) { f.life -= dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vy += 300 * dt; f.vx *= .96; }
  fx = fx.filter(f => f.life > 0);
  for (const t of texts) { t.life -= dt; t.y -= 30 * dt; }
  texts = texts.filter(t => t.life > 0);
  // 카메라: 캐릭터를 부드럽게 따라가요
  const px = stairs[pos].x * SW, py = -pos * SH;
  camX += (px - camX) * Math.min(1, dt * 12);
  camY += (py - camY) * Math.min(1, dt * 12);
  camX = clamp(camX, px - 60, px + 60);
  camY = clamp(camY, py - 50, py + 50);
}

    case "page": chPage += +b.dataset.d; body.scrollTop = 0; break;
    case "equip": DB.sel = id; persist(); jingle(); break;
    case "buy": { const c = CHARS[id]; if (!OWN.has(id) && DB.coins >= c.price) { DB.coins -= c.price; OWN.add(id); DB.sel = id; persist(); jingle(); showGot(checkUnlocks(null)); } break; }
    case "petBuy": { const p = PETS[id]; if (!DB.pets[id] && DB.coins >= p.price) { DB.coins -= p.price; DB.pets[id] = 1; DB.pet = id; save(); jingle(); showGot(checkUnlocks(null)); } break; }
    case "petEq": DB.pet = id; save(); tone(880, 1320, .12, "triangle", .08); break;
    case "petOff": DB.pet = -1; save(); break;
    case "petUp": { const c = upCost(id); if (DB.pets[id] && DB.pets[id] < 5 && DB.coins >= c) { DB.coins -= c; DB.pets[id]++; save(); [784, 1047, 1319].forEach((f, i) => tone(f, 0, .15, "triangle", .08, i * .05)); } break; }
    case "claim": { const D = today(); if (!D.c.includes(id)) { const m = D.m[id], T = DT[m.k]; if ((D.p[T.k] || 0) >= T.ns[m.l]) { D.c.push(id); DB.coins += DREW[m.l]; S.dailyDone++; save(); jingle(); showGot(checkUnlocks(null)); } } break; }
    case "claimAll": { const D = today(); if (!D.c.includes("a") && [0, 1, 2].every(i => D.c.includes(i))) { D.c.push("a"); DB.coins += ALLREW; save(); jingle(); showGot(checkUnlocks(null)); } break; }
    case "ach": { const A = ACH.find(x => x.id === b.dataset.aid); if (A && !DB.ach.includes(A.id) && A.get() >= A.n) { DB.ach.push(A.id); DB.coins += A.r; save(); jingle(); showGot(checkUnlocks(null)); } break; }
    case "g1": gacha(1); return;
    case "g10": gacha(10); return;
  }
  PK = calcPerks();
  renderSheet(); updateLobby();
});

// 처음 열면: 기존 기록으로 받을 수 있는 캐릭터 확인 후 로비 보여주기
showGot(checkUnlocks(null));
persist();
goLobby();

// 테스트에서 쓸 수 있게
window.__stairs = { act, start, goLobby, openSheet, CHARS, PETS, DB, get: () => ({ state, score, pos, face, timeLeft, stairs }) };
})();
</script>
