<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>총잡이 햄스터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --ink:#fdf3e0; --dim:#c9ad86; --dim2:#8e7352; --gold:#ffcf5c;
  --wood:#3a2418; --wood2:#5a3a24;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140d0a}
body{font-family:"Jua",system-ui,sans-serif;color:var(--ink);user-select:none}
#wrap{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.panel{background:linear-gradient(#2a1a11ee,#1b100acc);border:2px solid #6b4a2e;border-radius:14px;
  box-shadow:0 6px 18px #0008, inset 0 1px 0 #ffffff14}
#topL{position:absolute;left:12px;top:12px;padding:10px 14px;min-width:208px}
#topR{position:absolute;right:12px;top:12px;padding:10px 14px;text-align:right;min-width:120px}
#hpOuter{width:100%;height:16px;background:#120a06;border-radius:9px;overflow:hidden;border:1px solid #000a;margin-top:4px}
#hpFill{height:100%;width:100%;background:linear-gradient(#ff8a5c,#d9381e);transition:width .12s linear;box-shadow:inset 0 -3px 6px #0005}
#hpTxt{font-size:13px;color:var(--dim);margin-top:3px}
.lab{font-size:12.5px;color:var(--dim);letter-spacing:.5px}
.big{font-size:22px;line-height:1.12}
.gold{color:var(--gold)}
.gem{color:#9fe8ff}
#biomeName{font-size:12px;color:var(--dim2);margin-top:2px}

#waveBanner{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);
  text-align:center;opacity:0;transition:opacity .35s,transform .35s;width:92%}
#waveBanner .wb1{font-size:clamp(30px,8vw,62px);color:var(--gold);text-shadow:0 4px 0 #6b3a12,0 0 30px #ffb34755}
#waveBanner .wb2{font-size:clamp(13px,3.4vw,21px);color:#fff0d8;text-shadow:0 2px 6px #000}

#combo{position:absolute;right:14px;top:52%;transform:translateY(-50%);text-align:right;opacity:0;transition:opacity .2s}
#combo .cn{font-size:38px;color:var(--gold);text-shadow:0 3px 0 #74400f,0 0 24px #ffbe4a66;line-height:.95}
#combo .cl{font-size:12.5px;color:var(--dim)}

#gunbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 14px;text-align:center;min-width:236px;max-width:94vw}
#gname{font-size:18px}
#ammoDots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px;max-width:300px}
.dot{width:9px;height:17px;border-radius:3px;background:#5c3d26;box-shadow:inset 0 1px 0 #ffffff10}
.dot.on{background:linear-gradient(#ffe6a6,#e0a63c);box-shadow:0 0 6px #ffc45a88}
#reloadBar{height:6px;background:#120a06;border-radius:4px;margin-top:6px;overflow:hidden;display:none}
#reloadFill{height:100%;width:0;background:linear-gradient(90deg,#ffd978,#ff9f3c)}
#ammoNum{font-size:13.5px;color:var(--dim);margin-top:4px}

#dodgeUI{position:absolute;left:14px;bottom:14px;width:62px;height:62px;border-radius:50%;
  background:#1b100acc;border:2px solid #6b4a2e;display:grid;place-items:center;font-size:12px;color:var(--dim);text-align:center}
#dodgeUI .dIc{font-size:23px;line-height:1}
#dodgeUI.ready{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px #ffc45a44}
#dmgFlash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;transition:opacity .18s;
  background:radial-gradient(circle at 50% 50%,#ff2d0000 55%,#ff2d0066)}

/* ---------- 모바일 조작 ---------- */
#touch{position:absolute;inset:0;z-index:6;display:none}
#touch.on{display:block}
.stick{position:absolute;width:132px;height:132px;border-radius:50%;
  background:#ffffff0e;border:2px dashed #ffffff26;pointer-events:none;opacity:0;transition:opacity .15s}
.stick .kn{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6e0,#d9a35a);box-shadow:0 4px 12px #0007}
.stick.on{opacity:1}
.tbtn{position:absolute;width:72px;height:72px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(#4a2f1c,#2a1a10);border:2px solid #7a5433;color:var(--ink);
  font-size:12.5px;line-height:1.15;text-align:center;box-shadow:0 5px 14px #0008}
.tbtn:active{transform:translateY(2px)}
.tbtn .ic{font-size:23px}
#bDodge{right:112px;bottom:100px}
#bReload{right:22px;bottom:34px}

/* ---------- 오버레이 ---------- */
#ov{position:absolute;inset:0;z-index:20;display:none;place-items:start center;
  background:radial-gradient(circle at 50% 30%,#2a160bee,#0c0705f8);backdrop-filter:blur(3px);
  overflow-y:auto;overscroll-behavior:contain;padding:16px 12px 40px}
#ov.on{display:grid}
.card{width:min(620px,100%);background:linear-gradient(#40281a,#28180f);
  border:3px solid #7b5634;border-radius:22px;padding:20px 18px;text-align:center;
  box-shadow:0 20px 60px #000a, inset 0 2px 0 #ffffff18;margin:auto}
.card.lobby{width:min(880px,100%)}
.card h1{margin:0;font-size:clamp(32px,9vw,56px);font-weight:400;line-height:1.05;
  background:linear-gradient(90deg,#ffd97a,#ff9a4d,#ffd97a);-webkit-background-clip:text;background-clip:text;
  color:transparent;filter:drop-shadow(0 3px 0 #70340e)}
.card h2{margin:0 0 6px;font-size:clamp(24px,7vw,36px);font-weight:400;color:var(--gold)}
.sub{color:var(--dim);font-size:14.5px;margin:6px 0 14px;line-height:1.55}
.btn{display:block;width:100%;margin:9px 0;padding:14px;border:0;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:18px;color:#3a1f08;
  background:linear-gradient(#ffd97a,#efa63f);box-shadow:0 5px 0 #a3661f,0 8px 18px #0006}
.btn.big{font-size:22px;padding:17px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a3661f}
.btn.sec{background:linear-gradient(#5d4027,#3d2817);color:var(--ink);box-shadow:0 5px 0 #241509}
.hint{font-size:12.5px;color:var(--dim2);margin-top:10px;line-height:1.6}
.hint.small{font-size:11.5px}
.tag{display:inline-block;background:#6b2d1d;border-radius:8px;padding:2px 9px;font-size:12.5px;color:#ffd6c4}

/* 로비 머리/탭 */
.lobHead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ltitle{font-size:clamp(22px,5.5vw,32px);
  background:linear-gradient(90deg,#ffd97a,#ff9a4d,#ffd97a);-webkit-background-clip:text;background-clip:text;color:transparent}
.lcur{font-size:19px;color:#9fe8ff;background:#1b100a99;border:2px solid #3f6b7a;border-radius:12px;padding:5px 12px;white-space:nowrap}
.tabs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-bottom:12px}
.tb{font-family:inherit;font-size:14px;padding:9px 13px;border-radius:11px;cursor:pointer;
  background:#24150d;border:2px solid #5a3c24;color:var(--dim)}
.tb.on{background:linear-gradient(#ffd97a,#efa63f);border-color:#ffd97a;color:#3a1f08}
.subtabs{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;margin:0 0 10px}
.stb{font-family:inherit;font-size:13px;padding:7px 11px;border-radius:9px;cursor:pointer;
  background:#1d1109;border:2px solid #52381f;color:var(--dim)}
.stb.on{background:#6b4a2e;color:var(--ink);border-color:#b8873f}

/* 출격 탭 */
.outWrap{text-align:left}
.jobBig{display:flex;gap:12px;align-items:flex-start;background:#1d1109;border:2px solid #6b4a2e;
  border-radius:16px;padding:12px;margin-bottom:10px}
.jobBig .je{font-size:40px;line-height:1}
.jobBig .jn{font-size:20px;color:var(--gold)}
.jobBig .jd{font-size:13px;color:var(--dim);margin:2px 0 4px}
.jobBig .jp{font-size:12.5px;color:#9fe8ff}
.eqrow{display:flex;align-items:center;gap:10px;background:#1d1109;border:2px solid #4e351f;
  border-radius:12px;padding:10px 12px;margin-bottom:6px;cursor:pointer}
.eqrow:active{transform:scale(.99)}
.eqrow.eqw{border-color:#8a5a2e}
.eqe{font-size:20px;width:24px;text-align:center}
.eqn{font-size:13px;color:var(--dim2);width:52px;flex:none}
.eqv{font-size:14.5px;flex:1;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* 능력치 그리드 */
.sgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:7px;margin:12px 0}
.sc{background:#1b100a99;border:1px solid #5a3c24;border-radius:11px;padding:7px 4px;text-align:center}
.sc .sv{font-size:17px;color:var(--gold)}
.sc .sl{font-size:11px;color:var(--dim2)}

/* 아이템 그리드 */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:9px;text-align:left;margin-bottom:8px}
.grid.small{grid-template-columns:repeat(auto-fill,minmax(146px,1fr))}
.grid.jobs{grid-template-columns:repeat(auto-fill,minmax(228px,1fr))}
.item{background:#1d1109;border:2px solid #52381f;border-radius:14px;padding:10px;position:relative;
  cursor:pointer;transition:transform .08s}
.item:active{transform:scale(.975)}
.item.no{opacity:.46;cursor:not-allowed}
.item.can{border-color:#b8873f}
.item.cur{background:#2d1d10;box-shadow:0 0 0 2px #ffd97a inset}
.item.lock{opacity:.68}
.ih{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:3px}
.inm{font-size:14.5px;line-height:1.25}
.chip{font-size:10.5px;border:1px solid #666;border-radius:7px;padding:1px 6px;white-space:nowrap}
.chip.on{color:#3a1f08;background:var(--gold);border-color:var(--gold)}
.itag{font-size:11.5px;color:var(--dim2);margin-bottom:4px}
.ist{font-size:12px;color:var(--dim);line-height:1.5}
.iaf{font-size:11.5px;color:#a9c7e0;line-height:1.55;margin-top:3px}
.iaf b{color:#cfe9ff;font-weight:400}
.idesc{font-size:11.5px;color:var(--dim2);margin-top:4px;font-style:normal}
.ip{font-size:13px;color:var(--gold);margin-top:6px}
.ip.ok{color:#8fd96a}
.ip.new{color:#ff6b8a}
.lv{position:absolute;right:9px;top:8px;font-size:10.5px;color:var(--dim2)}
.ii{font-size:21px}
.ii.big{font-size:34px}
.it{font-size:14.5px;margin-top:2px}
.id{font-size:11.5px;color:var(--dim2);line-height:1.4;min-height:2.5em}
.item.unequip{display:grid;place-items:center;min-height:70px;border-style:dashed}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="dmgFlash"></div>

  <div id="hud">
    <div id="topL" class="panel">
      <div class="lab">체력</div>
      <div id="hpOuter"><div id="hpFill"></div></div>
      <div id="hpTxt">100 / 100</div>
      <div id="biomeName">황야 사막</div>
    </div>
    <div id="topR" class="panel">
      <div class="lab">웨이브</div>
      <div class="big" id="waveNum">1</div>
      <div class="lab" style="margin-top:4px">코인</div>
      <div class="big gold" id="coinNum">0</div>
      <div class="lab" style="margin-top:4px">다이아</div>
      <div class="big gem" id="gemNum">0</div>
      <div class="lab" id="leftNum" style="margin-top:4px">남은 적 0</div>
    </div>
    <div id="waveBanner"><div class="wb1">WAVE 1</div><div class="wb2">끝없는 사막</div></div>
    <div id="combo"><div class="cn">0</div><div class="cl">연속 처치</div></div>
    <div id="gunbar" class="panel">
      <div id="gname">리볼버</div>
      <div id="ammoDots"></div>
      <div id="reloadBar"><div id="reloadFill"></div></div>
      <div id="ammoNum">6 / 6</div>
    </div>
    <div id="dodgeUI"><div><div class="dIc">🌀</div><div id="dodgeTxt">회피</div></div></div>
  </div>

  <div id="touch">
    <div class="stick" id="stkL"><div class="kn"></div></div>
    <div class="stick" id="stkR"><div class="kn"></div></div>
    <div class="tbtn" id="bDodge"><div><div class="ic">🌀</div>회피</div></div>
    <div class="tbtn" id="bReload"><div><div class="ic">🔄</div>장전</div></div>
  </div>

  <div id="ov" class="on"><div class="card" id="ovCard"></div></div>
</div>

<script src="hamster-gunner-data.js"></script>
<script src="hamster-gunner.js"></script>
</body>
</html>
