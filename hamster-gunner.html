<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>총잡이 햄스터</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&display=swap">
<style>
:root{
  --ink:#fdf3e0; --dim:#c9ad86; --gold:#ffcf5c; --blood:#e4572e;
  --wood:#3a2418; --wood2:#5a3a24; --parch:#f3e2c0;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#140d0a}
body{font-family:"Jua",system-ui,sans-serif;color:var(--ink);user-select:none;touch-action:none}
#wrap{position:fixed;inset:0;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:auto}

/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;z-index:5}
.panel{
  background:linear-gradient(#2a1a11ee,#1b100acc);
  border:2px solid #6b4a2e;border-radius:14px;
  box-shadow:0 6px 18px #0008, inset 0 1px 0 #ffffff14;
}
#topL{position:absolute;left:12px;top:12px;padding:10px 14px;min-width:210px}
#topR{position:absolute;right:12px;top:12px;padding:10px 14px;text-align:right}
#hpOuter{width:100%;height:16px;background:#120a06;border-radius:9px;overflow:hidden;border:1px solid #000a;margin-top:4px}
#hpFill{height:100%;width:100%;background:linear-gradient(#ff8a5c,#d9381e);transition:width .12s linear;box-shadow:inset 0 -3px 6px #0005}
#hpGhost{position:absolute;height:16px;background:#ffd9c4aa;border-radius:9px;pointer-events:none;opacity:0;transition:opacity .3s}
#hpTxt{font-size:13px;color:var(--dim);margin-top:3px}
.lab{font-size:13px;color:var(--dim);letter-spacing:.5px}
.big{font-size:23px;line-height:1.1}
.gold{color:var(--gold)}

#waveBanner{
  position:absolute;left:50%;top:22%;transform:translate(-50%,-50%) scale(.8);
  text-align:center;opacity:0;transition:opacity .35s, transform .35s;
}
#waveBanner .wb1{font-size:clamp(30px,8vw,62px);color:var(--gold);text-shadow:0 4px 0 #6b3a12,0 0 30px #ffb34755}
#waveBanner .wb2{font-size:clamp(14px,3.4vw,22px);color:#fff0d8;text-shadow:0 2px 6px #000}

#combo{position:absolute;right:14px;top:50%;transform:translateY(-50%);text-align:right;opacity:0;transition:opacity .2s}
#combo .cn{font-size:40px;color:var(--gold);text-shadow:0 3px 0 #74400f,0 0 24px #ffbe4a66;line-height:.95}
#combo .cl{font-size:13px;color:var(--dim)}

#gunbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);padding:8px 14px;text-align:center;min-width:230px}
#gname{font-size:19px}
#ammoDots{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin-top:6px;max-width:300px}
.dot{width:9px;height:17px;border-radius:3px;background:#5c3d26;box-shadow:inset 0 1px 0 #ffffff10}
.dot.on{background:linear-gradient(#ffe6a6,#e0a63c);box-shadow:0 0 6px #ffc45a88}
#reloadBar{height:6px;background:#120a06;border-radius:4px;margin-top:6px;overflow:hidden;display:none}
#reloadFill{height:100%;width:0;background:linear-gradient(90deg,#ffd978,#ff9f3c)}
#ammoNum{font-size:14px;color:var(--dim);margin-top:4px}

#dodgeUI{position:absolute;left:14px;bottom:14px;width:62px;height:62px;border-radius:50%;
  background:#1b100acc;border:2px solid #6b4a2e;display:grid;place-items:center;font-size:12px;color:var(--dim)}
#dodgeUI .dIc{font-size:24px;line-height:1}
#dodgeUI.ready{border-color:var(--gold);color:var(--gold);box-shadow:0 0 14px #ffc45a44}

/* ---------- 모바일 조작 ---------- */
#touch{position:absolute;inset:0;z-index:6;display:none}
#touch.on{display:block}
.stick{position:absolute;width:132px;height:132px;border-radius:50%;
  background:#ffffff0e;border:2px dashed #ffffff26;pointer-events:none;opacity:0;transition:opacity .15s}
.stick .kn{position:absolute;left:50%;top:50%;width:54px;height:54px;margin:-27px 0 0 -27px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%,#fff6e0,#d9a35a);box-shadow:0 4px 12px #0007}
.stick.on{opacity:1}
.tbtn{position:absolute;width:74px;height:74px;border-radius:50%;display:grid;place-items:center;
  background:linear-gradient(#4a2f1c,#2a1a10);border:2px solid #7a5433;color:var(--ink);
  font-size:13px;line-height:1.15;text-align:center;box-shadow:0 5px 14px #0008}
.tbtn:active{transform:translateY(2px)}
.tbtn .ic{font-size:24px}
#bDodge{right:116px;bottom:104px}
#bReload{right:24px;bottom:150px}
#bSwap{right:24px;bottom:30px;width:62px;height:62px}

/* ---------- 오버레이 화면 ---------- */
#ov{position:absolute;inset:0;z-index:20;display:none;place-items:center;
  background:radial-gradient(circle at 50% 35%,#2a160bdd,#0c0705f2);backdrop-filter:blur(3px);
  overflow-y:auto;padding:18px}
#ov.on{display:grid}
.card{
  width:min(560px,100%);background:linear-gradient(#40281a,#28180f);
  border:3px solid #7b5634;border-radius:22px;padding:22px 20px;text-align:center;
  box-shadow:0 20px 60px #000a, inset 0 2px 0 #ffffff18;
}
.card h1{margin:0;font-size:clamp(34px,9vw,58px);font-weight:400;line-height:1.05;
  background:linear-gradient(90deg,#ffd97a,#ff9a4d,#ffd97a);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 3px 0 #70340e)}
.card h2{margin:0 0 4px;font-size:clamp(26px,7vw,40px);font-weight:400;color:var(--gold)}
.sub{color:var(--dim);font-size:15px;margin:6px 0 16px;line-height:1.5}
.btn{
  display:block;width:100%;margin:9px 0;padding:14px;border:0;border-radius:14px;cursor:pointer;
  font-family:inherit;font-size:19px;color:#3a1f08;
  background:linear-gradient(#ffd97a,#efa63f);box-shadow:0 5px 0 #a3661f,0 8px 18px #0006;
}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #a3661f}
.btn.sec{background:linear-gradient(#5d4027,#3d2817);color:var(--ink);box-shadow:0 5px 0 #241509}
.keys{display:grid;grid-template-columns:auto 1fr;gap:6px 12px;text-align:left;font-size:14px;color:var(--dim);margin:14px 2px 0}
.keys b{color:var(--ink);font-weight:400}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0 4px}
.stat{background:#1b100a99;border:1px solid #6b4a2e;border-radius:12px;padding:9px}
.stat .sv{font-size:24px;color:var(--gold)}
.stat .sl{font-size:12px;color:var(--dim)}

/* 상점 */
#shopGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:9px;margin:14px 0 6px;text-align:left}
.item{background:#1d1109;border:2px solid #6b4a2e;border-radius:14px;padding:10px;cursor:pointer;position:relative;
  transition:transform .08s,border-color .15s}
.item:active{transform:scale(.97)}
.item.can{border-color:#b8873f}
.item.no{opacity:.45;cursor:not-allowed}
.item .ii{font-size:22px}
.item .it{font-size:15px;margin-top:2px}
.item .id{font-size:11.5px;color:var(--dim);line-height:1.35;min-height:2.6em}
.item .ip{font-size:14px;color:var(--gold);margin-top:5px}
.item .lv{position:absolute;right:8px;top:7px;font-size:11px;color:var(--dim)}
#shopCoins{font-size:21px;color:var(--gold)}
.hint{font-size:12px;color:#8e7352;margin-top:10px;line-height:1.5}
.tag{display:inline-block;background:#6b2d1d;border-radius:8px;padding:2px 8px;font-size:12px;color:#ffd6c4;margin-left:5px}
#dmgFlash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0;
  background:radial-gradient(circle at 50% 50%,#ff2d0000 55%,#ff2d0066);transition:opacity .18s}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="cv"></canvas>
  <div id="dmgFlash"></div>

  <div id="hud">
    <div id="topL" class="panel">
      <div class="lab">체력</div>
      <div id="hpOuter"><div id="hpFill"></div></div>
      <div id="hpTxt">100 / 100</div>
    </div>
    <div id="topR" class="panel">
      <div class="lab">웨이브</div>
      <div class="big" id="waveNum">1</div>
      <div class="lab" style="margin-top:5px">코인</div>
      <div class="big gold" id="coinNum">0</div>
      <div class="lab" id="leftNum" style="margin-top:4px">남은 적 0</div>
    </div>
    <div id="waveBanner"><div class="wb1">WAVE 1</div><div class="wb2">사막의 무법자들이 몰려온다</div></div>
    <div id="combo"><div class="cn">0</div><div class="cl">연속 처치</div></div>
    <div id="gunbar" class="panel">
      <div id="gname">리볼버</div>
      <div id="ammoDots"></div>
      <div id="reloadBar"><div id="reloadFill"></div></div>
      <div id="ammoNum">6 / 6</div>
    </div>
    <div id="dodgeUI"><div><div class="dIc">🌀</div><div id="dodgeTxt">회피</div></div></div>
  </div>

  <div id="touch">
    <div class="stick" id="stkL"><div class="kn"></div></div>
    <div class="stick" id="stkR"><div class="kn"></div></div>
    <div class="tbtn" id="bDodge"><div><div class="ic">🌀</div>회피</div></div>
    <div class="tbtn" id="bReload"><div><div class="ic">🔄</div>장전</div></div>
    <div class="tbtn" id="bSwap"><div><div class="ic">🔁</div>무기</div></div>
  </div>

  <div id="ov" class="on"><div class="card" id="ovCard"></div></div>
</div>

<script>
"use strict";
/* =========================================================
   총잡이 햄스터 — Hamster Gunner
   서부 사막 탑다운 웨이브 슈터 (단일 HTML)
   ========================================================= */

/* ---------------- 유틸 ---------------- */
const TAU=Math.PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const rnd=(a=1,b=0)=>b+Math.random()*(a-b);
const rndi=(a,b)=>Math.floor(rnd(b+1,a));
const pick=a=>a[(Math.random()*a.length)|0];
const dist2=(ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return dx*dx+dy*dy;};
const ang=(ax,ay,bx,by)=>Math.atan2(by-ay,bx-ax);
const aLerp=(a,b,t)=>{let d=((b-a+Math.PI)%TAU+TAU)%TAU-Math.PI;return a+d*t;};
function mul32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ---------------- 캔버스 ---------------- */
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
let VW=1,VH=1,DPR=1,SCALE=1;
function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  VW=cv.clientWidth; VH=cv.clientHeight;
  cv.width=Math.round(VW*DPR); cv.height=Math.round(VH*DPR);
  SCALE=clamp(VW/1050,0.62,1.3);
}
addEventListener('resize',resize);

/* ---------------- 사운드 (WebAudio 합성) ---------------- */
const SND={
  ctx:null, master:null, on:true,
  init(){
    if(this.ctx)return;
    try{
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC)return;
      this.ctx=new AC();
      this.master=this.ctx.createGain(); this.master.gain.value=.5; this.master.connect(this.ctx.destination);
      this.noiseBuf=this.ctx.createBuffer(1,this.ctx.sampleRate*0.6,this.ctx.sampleRate);
      const d=this.noiseBuf.getChannelData(0);
      for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    }catch(e){}
  },
  resume(){ if(this.ctx&&this.ctx.state==='suspended')this.ctx.resume(); },
  env(node,vol,atk,dec){
    const g=this.ctx.createGain(),t=this.ctx.currentTime;
    g.gain.setValueAtTime(0,t);
    g.gain.linearRampToValueAtTime(vol,t+atk);
    g.gain.exponentialRampToValueAtTime(0.0001,t+atk+dec);
    node.connect(g); g.connect(this.master);
    return {g,stop:t+atk+dec};
  },
  noise(vol,dec,freq,q,type){
    if(!this.ctx||!this.on)return;
    const s=this.ctx.createBufferSource(); s.buffer=this.noiseBuf;
    const f=this.ctx.createBiquadFilter(); f.type=type||'bandpass'; f.frequency.value=freq; f.Q.value=q||1;
    s.connect(f);
    const e=this.env(f,vol,0.002,dec);
    s.start(); s.stop(e.stop+0.02);
  },
  tone(f0,f1,vol,dec,type){
    if(!this.ctx||!this.on)return;
    const o=this.ctx.createOscillator(); o.type=type||'square';
    const t=this.ctx.currentTime;
    o.frequency.setValueAtTime(f0,t);
    if(f1)o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dec);
    const e=this.env(o,vol,0.004,dec);
    o.start(); o.stop(e.stop+0.02);
  },
  shot(kind){
    if(!this.ctx||!this.on)return;
    if(kind==='shotgun'){ this.noise(.5,.26,900,.7); this.tone(160,45,.3,.22,'sawtooth'); }
    else if(kind==='rifle'){ this.noise(.4,.17,1800,1.4); this.tone(300,70,.25,.14,'square'); }
    else if(kind==='gatling'){ this.noise(.22,.06,1500,1.6); this.tone(420,160,.12,.05,'square'); }
    else { this.noise(.38,.13,1300,1.1); this.tone(260,80,.22,.1,'square'); }
  },
  hit(){ this.noise(.22,.07,2600,2.4); },
  crit(){ this.noise(.3,.09,3400,3); this.tone(1200,500,.12,.09,'triangle'); },
  kill(){ this.tone(500,160,.16,.16,'triangle'); this.noise(.2,.14,700,.9); },
  coin(){ this.tone(1180,0,.12,.07,'triangle'); setTimeout(()=>this.tone(1660,0,.1,.09,'triangle'),55); },
  hurt(){ this.noise(.4,.2,420,.6); this.tone(180,60,.25,.2,'sawtooth'); },
  reload(){ this.noise(.22,.05,2200,3); setTimeout(()=>this.noise(.26,.07,1100,2),130); },
  dodge(){ this.noise(.18,.17,600,.8,'lowpass'); },
  buy(){ this.tone(700,0,.14,.07,'triangle'); setTimeout(()=>this.tone(1050,0,.14,.1,'triangle'),70); },
  boss(){ this.tone(110,55,.4,.9,'sawtooth'); this.noise(.3,.7,220,.6); },
  wave(){ this.tone(440,0,.18,.14,'triangle'); setTimeout(()=>this.tone(660,0,.18,.2,'triangle'),130); },
  dead(){ this.tone(300,60,.35,1.1,'sawtooth'); }
};

/* ---------------- 아레나 / 지형 ---------------- */
const AW=1760, AH=1280;
let ground=null, props=[];

function buildWorld(){
  const R=mul32(20261109);
  // 지형 오프스크린
  ground=document.createElement('canvas'); ground.width=AW; ground.height=AH;
  const g=ground.getContext('2d');
  // 베이스 모래
  const base=g.createLinearGradient(0,0,AW*.3,AH);
  base.addColorStop(0,'#d8ab6b'); base.addColorStop(.5,'#cf9f5e'); base.addColorStop(1,'#c08f50');
  g.fillStyle=base; g.fillRect(0,0,AW,AH);
  // 넓은 색 얼룩
  for(let i=0;i<190;i++){
    const x=R()*AW,y=R()*AH,r=40+R()*190;
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    const dark=R()<.5;
    gr.addColorStop(0,dark?'#a87a3f22':'#eccf9622'); gr.addColorStop(1,'#00000000');
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,TAU); g.fill();
  }
  // 모래 입자
  for(let i=0;i<14000;i++){
    const x=R()*AW,y=R()*AH;
    g.fillStyle=R()<.5?'#00000012':'#ffffff14';
    g.fillRect(x,y,1+ (R()<.12?1:0),1);
  }
  // 갈라진 땅
  for(let i=0;i<34;i++){
    let x=R()*AW,y=R()*AH,a=R()*TAU;
    g.strokeStyle='#8a5f2d33'; g.lineWidth=1+R()*2; g.beginPath(); g.moveTo(x,y);
    for(let s=0;s<rndi(5,14);s++){ a+=(R()-.5)*1.2; x+=Math.cos(a)*(14+R()*26); y+=Math.sin(a)*(14+R()*26); g.lineTo(x,y); }
    g.stroke();
  }
  // 마른 풀
  for(let i=0;i<420;i++){
    const x=R()*AW,y=R()*AH;
    g.strokeStyle=R()<.5?'#9a7a3c66':'#b9933f55'; g.lineWidth=1.2;
    for(let b=0;b<3;b++){ g.beginPath(); g.moveTo(x,y); g.lineTo(x+(R()-.5)*12,y-6-R()*10); g.stroke(); }
  }
  // 바퀴 자국
  for(let i=0;i<5;i++){
    let y=R()*AH, amp=20+R()*50;
    g.strokeStyle='#8f653022'; g.lineWidth=7;
    for(let o=-10;o<=10;o+=20){
      g.beginPath();
      for(let x=0;x<=AW;x+=18) g.lineTo(x, y+o+Math.sin(x*0.004+i)*amp);
      g.stroke();
    }
  }
  // 외곽 암반 테두리
  g.strokeStyle='#6d4522'; g.lineWidth=26; g.strokeRect(13,13,AW-26,AH-26);
  g.strokeStyle='#8b5c2e'; g.lineWidth=10; g.strokeRect(13,13,AW-26,AH-26);

  // 프롭 배치
  props=[];
  const tryPut=(type,r,n)=>{
    let placed=0,guard=0;
    while(placed<n && guard++<4000){
      const x=90+R()*(AW-180), y=90+R()*(AH-180);
      if(dist2(x,y,AW/2,AH/2)<220*220) continue;         // 중앙 스폰 공간 확보
      if(props.some(p=>dist2(x,y,p.x,p.y)<(p.r+r+56)**2)) continue;
      props.push({type,x,y,r,s:0.8+R()*0.5,rot:R()*TAU,hp:type==='barrel'?34:0});
      placed++;
    }
  };
  tryPut('cactus',20,16);
  tryPut('rock',26,13);
  tryPut('barrel',19,12);
  tryPut('skull',16,6);
  tryPut('wagon',40,2);

  // 프롭을 지형에 그림자로 미리 찍어 깊이감
  for(const p of props){
    const gr=g.createRadialGradient(p.x,p.y+p.r*.5,0,p.x,p.y+p.r*.5,p.r*2.1);
    gr.addColorStop(0,'#00000038'); gr.addColorStop(1,'#00000000');
    g.fillStyle=gr; g.beginPath(); g.arc(p.x,p.y+p.r*.5,p.r*2.1,0,TAU); g.fill();
  }
}

/* ---------------- 무기 ---------------- */
const GUNS=[
  {id:'revolver',name:'리볼버',   ic:'🔫', dmg:30, rof:.26, mag:6,  rel:.95, spread:.028, speed:980,  pierce:0, pellets:1, kick:6.5, snd:'rev',
   desc:'기본 지급. 든든한 한 발.'},
  {id:'shotgun', name:'샷건',     ic:'💥', dmg:15, rof:.72, mag:2,  rel:1.15,spread:.175, speed:850,  pierce:0, pellets:7, kick:15, snd:'shotgun', cost:120,
   desc:'산탄 7발. 근접에서 압도적.'},
  {id:'rifle',   name:'윈체스터', ic:'🎯', dmg:58, rof:.5,  mag:5,  rel:1.3, spread:.012, speed:1600, pierce:2, pellets:1, kick:11, snd:'rifle', cost:200,
   desc:'적 3명을 관통하는 장거리 소총.'},
  {id:'dual',    name:'쌍권총',   ic:'✌️', dmg:19, rof:.11, mag:22, rel:1.05,spread:.075, speed:1020, pierce:0, pellets:1, kick:4, snd:'rev', cost:260, dual:true,
   desc:'양손 연사. 탄막으로 밀어붙인다.'},
  {id:'gatling', name:'개틀링',   ic:'🌪️', dmg:13, rof:.055,mag:70, rel:1.9, spread:.105, speed:1100, pierce:0, pellets:1, kick:2.6, snd:'gatling', cost:420, spin:true,
   desc:'회전이 붙을수록 빨라지는 폭풍.'}
];

/* ---------------- 적 정의 ---------------- */
const ETYPE={
  rat:    {name:'들쥐 갱단', hp:44,  spd:112, r:17, dmg:11, coin:4,  col:'#8d7a6b', kind:'melee'},
  snake:  {name:'사막 뱀',   hp:30,  spd:178, r:14, dmg:9,  coin:5,  col:'#b4a23c', kind:'melee', zig:true},
  scorp:  {name:'전갈',      hp:120, spd:78,  r:22, dmg:20, coin:11, col:'#6e4b7a', kind:'charge', armor:4},
  vulture:{name:'독수리',    hp:62,  spd:150, r:19, dmg:14, coin:8,  col:'#5d5b63', kind:'dive', fly:true},
  mole:   {name:'두더지 총잡이', hp:70, spd:92, r:18, dmg:0, coin:12, col:'#7a5a44', kind:'gunner'},
  boss:   {name:'고양이 두목', hp:1000, spd:92, r:46, dmg:26, coin:160, col:'#c9893f', kind:'boss', armor:7}
};

/* ---------------- 게임 상태 ---------------- */
let state='title';
let P,enemies,bullets,ebullets,parts,pickups,texts,decals,tumbles,motes;
let cam={x:AW/2,y:AH/2,sx:0,sy:0,shake:0};
let wave,coins,kills,combo,comboT,timeScale,hitStop,spawnQ,spawnT,waveActive,bossAlive;
let best=+(localStorage.getItem('hg_best')||0);
let totalCoinsEarned=0, runTime=0;

const UPG={hp:0,spd:0,dmg:0,rel:0,mag:0,crit:0,dodge:0,luck:0,pierce:0};
let owned={revolver:true};

function baseStats(){
  return {
    maxHp: 100+UPG.hp*22,
    spd: 268*(1+UPG.spd*0.075),
    dmg: 1+UPG.dmg*0.13,
    rel: 1/(1+UPG.rel*0.14),
    mag: 1+UPG.mag*0.28,
    crit: 0.05+UPG.crit*0.055,
    dodgeCd: 1.15*(1/(1+UPG.dodge*0.13)),
    luck: UPG.luck*0.1,
    pierce: UPG.pierce
  };
}

function newRun(){
  for(const k in UPG)UPG[k]=0;
  owned={revolver:true};
  const s=baseStats();
  P={x:AW/2,y:AH/2,vx:0,vy:0,r:17,hp:s.maxHp,maxHp:s.maxHp,
     aim:-Math.PI/2, face:-Math.PI/2, gun:0, ammo:GUNS[0].mag, reloading:0, relTotal:0,
     cool:0, dodgeCd:0, dodgeT:0, dodgeAng:0, inv:0, walk:0, kick:0, spin:0, hurtFlash:0, dualSide:1};
  enemies=[];bullets=[];ebullets=[];parts=[];pickups=[];texts=[];decals=[];
  tumbles=[];motes=[];
  for(let i=0;i<4;i++)tumbles.push({x:rnd(AW),y:rnd(AH),r:rnd(26,14),a:rnd(TAU),sp:rnd(130,70),rot:0});
  for(let i=0;i<90;i++)motes.push({x:rnd(AW),y:rnd(AH),z:rnd(1,.3),sp:rnd(90,40)});
  cam.x=P.x;cam.y=P.y;cam.shake=0;
  wave=0;coins=0;kills=0;combo=0;comboT=0;timeScale=1;hitStop=0;
  spawnQ=[];spawnT=0;waveActive=false;bossAlive=false;
  totalCoinsEarned=0;runTime=0;
  refreshAmmoUI(true);
  nextWave();
}

/* ---------------- 웨이브 ---------------- */
function nextWave(){
  wave++;
  waveActive=true; spawnQ=[]; spawnT=.6;
  const budget = 5 + wave*2.6 + Math.pow(wave,1.45)*0.55;
  const isBoss = wave%5===0;

  if(isBoss){
    spawnQ.push({t:'boss',d:1.2});
    const minions=Math.min(10,2+Math.floor(wave/5)*2);
    for(let i=0;i<minions;i++)spawnQ.push({t:pick(['rat','snake']),d:2.4+i*.5});
  }else{
    let b=budget, t=0;
    const pool=[['rat',1]];
    if(wave>=2)pool.push(['snake',1.1]);
    if(wave>=3)pool.push(['mole',2.2]);
    if(wave>=4)pool.push(['vulture',2]);
    if(wave>=6)pool.push(['scorp',3.2]);
    while(b>0){
      const e=pick(pool);
      b-=e[1];
      spawnQ.push({t:e[0],d:t});
      t+=clamp(1.5-wave*0.045,0.33,1.5)*rnd(1.35,.65);
    }
  }
  banner('WAVE '+wave, isBoss?'⚠ 보스 등장 — 고양이 두목':pick([
    '사막의 무법자들이 몰려온다','모래 먼지 속에서 발소리가 들린다','탄창을 채워라, 총잡이','해가 기울기 전에 끝내라']));
  SND.wave();
  document.getElementById('waveNum').textContent=wave;
}

function spawnEnemy(type){
  const T=ETYPE[type];
  // 카메라 밖 가장자리에서 등장
  let x,y,guard=0;
  do{
    const side=rndi(0,3);
    if(side===0){x=rnd(AW-80,80);y=70;}
    else if(side===1){x=rnd(AW-80,80);y=AH-70;}
    else if(side===2){x=70;y=rnd(AH-80,80);}
    else {x=AW-70;y=rnd(AH-80,80);}
  }while(dist2(x,y,P.x,P.y)<420*420 && guard++<40);

  const lvl=1+(wave-1)*0.17;
  const e={
    type,x,y,vx:0,vy:0,r:T.r,
    hp:T.hp*(type==='boss'?(1+(Math.floor(wave/5)-1)*0.75):lvl),
    maxHp:0, spd:T.spd*(type==='boss'?1:clamp(1+(wave-1)*0.012,1,1.5)),
    dmg:T.dmg*clamp(lvl*0.75,1,3), coin:T.coin, armor:T.armor||0,
    a:ang(x,y,P.x,P.y), walk:rnd(TAU), hurt:0, flash:0, kb:{x:0,y:0},
    st:'walk', t:0, cd:rnd(1.4,.5), phase:0, tele:0, dead:false, scale:0
  };
  e.maxHp=e.hp;
  if(type==='boss'){ bossAlive=true; SND.boss(); cam.shake=Math.max(cam.shake,14);
    banner('고양이 두목','사막 최악의 현상금 표적'); }
  enemies.push(e);
  // 등장 먼지
  for(let i=0;i<14;i++)puff(e.x,e.y,'#d9b377');
}

/* ---------------- 파티클 ---------------- */
function puff(x,y,col,sp=1){
  parts.push({k:'puff',x,y,vx:rnd(60,-60)*sp,vy:rnd(60,-60)*sp,r:rnd(13,5)*sp,life:rnd(.7,.35),t:0,col});
}
function spark(x,y,a,col,n=6,sp=1){
  for(let i=0;i<n;i++){
    const aa=a+rnd(.9,-.9);
    parts.push({k:'spark',x,y,vx:Math.cos(aa)*rnd(560,160)*sp,vy:Math.sin(aa)*rnd(560,160)*sp,
      life:rnd(.3,.12),t:0,col:col||'#ffd98a',len:rnd(14,6)});
  }
}
function fur(x,y,col,n=10){
  for(let i=0;i<n;i++){
    const a=rnd(TAU);
    parts.push({k:'fur',x,y,vx:Math.cos(a)*rnd(260,60),vy:Math.sin(a)*rnd(260,60),
      life:rnd(.9,.45),t:0,col,r:rnd(5,2),rot:rnd(TAU),vr:rnd(9,-9)});
  }
}
function shell(x,y,a){
  parts.push({k:'shell',x,y,vx:Math.cos(a+1.7)*rnd(210,110),vy:Math.sin(a+1.7)*rnd(210,110)-60,
    life:1.1,t:0,rot:rnd(TAU),vr:rnd(16,-16),gz:rnd(120,70),z:6});
}
function ring(x,y,col,r0,r1,life){ parts.push({k:'ring',x,y,r0,r1,life,t:0,col}); }
function floatText(x,y,txt,col,size=17,crit=false){
  texts.push({x,y,txt,col,size,t:0,life:crit?.95:.7,vy:-46,crit});
}

/* ---------------- 발사 ---------------- */
function fire(){
  const G=GUNS[P.gun], s=baseStats();
  if(P.reloading>0||P.cool>0)return;
  if(P.ammo<=0){ startReload(); return; }
  let rof=G.rof;
  if(G.spin) rof=G.rof*lerp(2.2,0.85,P.spin);
  P.cool=rof;
  P.ammo--;
  const pierce=(G.pierce||0)+s.pierce;
  const n=G.pellets;
  for(let i=0;i<n;i++){
    const sp=G.spread*(G.spin?lerp(1.5,.8,P.spin):1);
    const a=P.aim+(n>1?(i/(n-1)-.5)*G.spread*2:0)+rnd(sp,-sp);
    const off=G.dual? (P.dualSide*9):0;
    const bx=P.x+Math.cos(P.aim)*22+Math.cos(P.aim+Math.PI/2)*off;
    const by=P.y+Math.sin(P.aim)*22+Math.sin(P.aim+Math.PI/2)*off;
    const crit=Math.random()<s.crit;
    bullets.push({x:bx,y:by,px:bx,py:by,
      vx:Math.cos(a)*G.speed*rnd(1.06,.94), vy:Math.sin(a)*G.speed*rnd(1.06,.94),
      dmg:G.dmg*s.dmg*(crit?2.2:1), crit, pierce, hit:new Set(), life:1.1, t:0, r:4, col:crit?'#fff1b0':'#ffe2a0'});
  }
  if(G.dual)P.dualSide*=-1;
  // 연출
  const mx=P.x+Math.cos(P.aim)*24, my=P.y+Math.sin(P.aim)*24;
  spark(mx,my,P.aim,'#ffe08a',G.pellets>1?14:7,G.pellets>1?1.5:1);
  ring(mx,my,'#ffd16a',4,G.pellets>1?34:20,.16);
  shell(P.x,P.y,P.aim);
  P.kick=G.kick;
  cam.shake=Math.min(22,cam.shake+G.kick*0.55);
  SND.shot(G.snd);
  if(P.ammo<=0)startReload();
  refreshAmmoUI();
}
function startReload(){
  const G=GUNS[P.gun],s=baseStats();
  if(P.reloading>0)return;
  const magMax=Math.round(G.mag*s.mag);
  if(P.ammo>=magMax)return;
  P.relTotal=G.rel*s.rel; P.reloading=P.relTotal;
  SND.reload();
  document.getElementById('reloadBar').style.display='block';
}
function magMax(){ return Math.round(GUNS[P.gun].mag*baseStats().mag); }
function swapGun(dir){
  const list=GUNS.map((g,i)=>i).filter(i=>owned[GUNS[i].id]);
  if(list.length<2)return;
  const cur=list.indexOf(P.gun);
  P.gun=list[(cur+(dir||1)+list.length)%list.length];
  P.ammo=magMax(); P.reloading=0; P.spin=0;
  document.getElementById('reloadBar').style.display='none';
  SND.noise(.2,.06,1400,2);
  refreshAmmoUI(true);
}

/* ---------------- 적 피격 ---------------- */
function damageEnemy(e,dmg,crit,ax,ay){
  const d=Math.max(1,dmg-e.armor);
  e.hp-=d; e.flash=.14; e.hurt=.2;
  const a=ang(ax,ay,e.x,e.y);
  e.kb.x+=Math.cos(a)*(crit?260:150)/(e.type==='boss'?6:1);
  e.kb.y+=Math.sin(a)*(crit?260:150)/(e.type==='boss'?6:1);
  floatText(e.x,e.y-e.r-6,Math.round(d),crit?'#ffe066':'#fff',crit?24:17,crit);
  spark(e.x,e.y,a,crit?'#ffe066':'#ffb9a0',crit?10:5);
  fur(e.x,e.y,ETYPE[e.type].col,crit?7:3);
  if(crit){ SND.crit(); hitStop=Math.max(hitStop,.045); cam.shake=Math.min(26,cam.shake+5); }
  else SND.hit();
  if(e.hp<=0)killEnemy(e);
}
function killEnemy(e){
  if(e.dead)return; e.dead=true;
  const T=ETYPE[e.type];
  kills++; combo++; comboT=2.4;
  fur(e.x,e.y,T.col,e.type==='boss'?70:16);
  for(let i=0;i<(e.type==='boss'?26:7);i++)puff(e.x,e.y,'#e0bd86',e.type==='boss'?2:1);
  ring(e.x,e.y,'#ffd9a0',e.r,e.r*(e.type==='boss'?7:3),e.type==='boss'?.6:.3);
  SND.kill();
  // 코인
  const n=Math.max(1,Math.round(e.coin*(1+baseStats().luck)));
  for(let i=0;i<Math.min(n,14);i++){
    const a=rnd(TAU),s=rnd(230,60);
    pickups.push({k:'coin',x:e.x,y:e.y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,v:Math.ceil(n/Math.min(n,14)),t:0,r:9});
  }
  if(Math.random()<(e.type==='boss'?1:0.055+baseStats().luck*0.1))
    pickups.push({k:'heart',x:e.x+rnd(20,-20),y:e.y+rnd(20,-20),vx:0,vy:0,v:0,t:0,r:12});
  if(e.type==='boss'){
    bossAlive=false; timeScale=0.25; cam.shake=30;
    banner('두목 처치!','현상금을 챙겼다');
  }
  if(e.type==='mole'&&Math.random()<.35)
    pickups.push({k:'ammo',x:e.x,y:e.y,vx:0,vy:0,v:0,t:0,r:11});
}

/* ---------------- 플레이어 피격 ---------------- */
function hurtPlayer(d){
  if(P.inv>0||P.dodgeT>0)return;
  P.hp-=d; P.inv=.6; P.hurtFlash=.3;
  combo=0; cam.shake=Math.min(30,cam.shake+11);
  SND.hurt();
  const f=document.getElementById('dmgFlash');
  f.style.opacity=Math.min(.9,0.3+d/60); setTimeout(()=>f.style.opacity=0,120);
  fur(P.x,P.y,'#f0d9b5',8);
  if(P.hp<=0){ P.hp=0; gameOver(); }
  refreshHpUI();
}

/* ---------------- 충돌: 프롭 밀어내기 ---------------- */
function solidProp(p){ return p.type!=='skull'&&p.type!=='gone'; }
function pushOutProps(o,soft){
  for(const p of props){
    if(!solidProp(p))continue;
    const rr=(p.r*p.s*0.72+o.r);
    const d2=dist2(o.x,o.y,p.x,p.y);
    if(d2<rr*rr){
      const d=Math.sqrt(d2)||.001;
      const nx=(o.x-p.x)/d, ny=(o.y-p.y)/d;
      o.x=p.x+nx*rr; o.y=p.y+ny*rr;
      if(!soft){ o.vx*=.4; o.vy*=.4; }
    }
  }
  o.x=clamp(o.x,36+o.r,AW-36-o.r);
  o.y=clamp(o.y,36+o.r,AH-36-o.r);
}

/* ---------------- 업데이트 ---------------- */
function update(dt){
  runTime+=dt;
  const s=baseStats();

  /* --- 입력 → 이동 --- */
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(tl.active){ mx+=tl.x; my+=tl.y; }
  const ml=Math.hypot(mx,my);
  if(ml>1){mx/=ml;my/=ml;}

  // 조준 (카메라가 움직여도 매 프레임 월드 좌표 재계산)
  if(tr.active){ P.aim=Math.atan2(tr.y,tr.x); }
  else if(mouse.inside){
    mouse.wx=(mouse.x-VW/2-cam.sx)/SCALE+cam.x;
    mouse.wy=(mouse.y-VH/2-cam.sy)/SCALE+cam.y;
    P.aim=ang(P.x,P.y,mouse.wx,mouse.wy);
  }
  P.face=aLerp(P.face,P.aim,1-Math.pow(.0005,dt));

  // 회피 굴러가기
  if(P.dodgeT>0){
    P.dodgeT-=dt;
    const sp=640*(1-Math.pow(1-P.dodgeT/0.3,2)*0.25);
    P.x+=Math.cos(P.dodgeAng)*sp*dt;
    P.y+=Math.sin(P.dodgeAng)*sp*dt;
    if(Math.random()<dt*60)puff(P.x,P.y,'#e3c492');
  }else{
    const sp=s.spd*(GUNS[P.gun].spin&&shooting?0.62:1);
    P.vx=lerp(P.vx,mx*sp,1-Math.pow(.0001,dt));
    P.vy=lerp(P.vy,my*sp,1-Math.pow(.0001,dt));
    P.x+=P.vx*dt; P.y+=P.vy*dt;
    if(ml>.1){
      P.walk+=dt*12;
      if(Math.random()<dt*9)puff(P.x+rnd(8,-8),P.y+10,'#d8b584',.5);
    }else P.walk=lerp(P.walk,0,dt*8);
  }
  P.dodgeCd=Math.max(0,P.dodgeCd-dt);
  P.inv=Math.max(0,P.inv-dt);
  P.hurtFlash=Math.max(0,P.hurtFlash-dt);
  P.kick=Math.max(0,P.kick-dt*42);
  pushOutProps(P);

  // 사격
  P.cool=Math.max(0,P.cool-dt);
  if(P.reloading>0){
    P.reloading-=dt;
    if(P.reloading<=0){ P.ammo=magMax(); P.reloading=0;
      document.getElementById('reloadBar').style.display='none'; refreshAmmoUI(true); }
    else document.getElementById('reloadFill').style.width=(100*(1-P.reloading/P.relTotal))+'%';
  }
  if(GUNS[P.gun].spin) P.spin=clamp(P.spin+(shooting?dt*1.1:-dt*1.8),0,1);
  if(shooting&&P.dodgeT<=0)fire();

  /* --- 스폰 --- */
  if(waveActive){
    spawnT-=dt;
    while(spawnQ.length&&spawnQ[0].d<=0){ spawnEnemy(spawnQ.shift().t); }
    for(const q of spawnQ)q.d-=dt;
    if(!spawnQ.length&&!enemies.length){
      waveActive=false;
      setTimeout(()=>{ if(state==='play')openShop(); },800);
    }
  }
  document.getElementById('leftNum').textContent='남은 적 '+(enemies.length+spawnQ.length);

  /* --- 적 --- */
  for(let i=enemies.length-1;i>=0;i--){
    const e=enemies[i];
    e.t+=dt; e.flash=Math.max(0,e.flash-dt); e.hurt=Math.max(0,e.hurt-dt);
    e.scale=Math.min(1,e.scale+dt*4);
    const T=ETYPE[e.type];
    const d=Math.sqrt(dist2(e.x,e.y,P.x,P.y));
    const toP=ang(e.x,e.y,P.x,P.y);

    // 넉백 감쇠
    e.x+=e.kb.x*dt; e.y+=e.kb.y*dt;
    e.kb.x*=Math.pow(.0015,dt); e.kb.y*=Math.pow(.0015,dt);

    if(T.kind==='melee'){
      let a=toP;
      if(T.zig)a+=Math.sin(e.t*7)*0.55;
      e.a=aLerp(e.a,a,1-Math.pow(.002,dt));
      e.x+=Math.cos(e.a)*e.spd*dt; e.y+=Math.sin(e.a)*e.spd*dt;
      e.walk+=dt*11;
      if(d<e.r+P.r){ hurtPlayer(e.dmg); e.kb.x=-Math.cos(toP)*300; e.kb.y=-Math.sin(toP)*300; }
    }
    else if(T.kind==='charge'){
      e.cd-=dt;
      if(e.st==='walk'){
        e.a=aLerp(e.a,toP,1-Math.pow(.004,dt));
        e.x+=Math.cos(e.a)*e.spd*dt; e.y+=Math.sin(e.a)*e.spd*dt; e.walk+=dt*8;
        if(d<330&&e.cd<=0){ e.st='tele'; e.tele=.55; }
      }else if(e.st==='tele'){
        e.tele-=dt; e.a=aLerp(e.a,toP,1-Math.pow(.02,dt));
        if(e.tele<=0){ e.st='dash'; e.t2=.42; SND.noise(.25,.2,500,.8); }
      }else{
        e.t2-=dt;
        e.x+=Math.cos(e.a)*760*dt; e.y+=Math.sin(e.a)*760*dt;
        if(Math.random()<dt*50)puff(e.x,e.y,'#cfae7e');
        if(d<e.r+P.r){ hurtPlayer(e.dmg); e.t2=0; }
        if(e.t2<=0){ e.st='walk'; e.cd=rnd(2.6,1.5); }
      }
    }
    else if(T.kind==='dive'){
      e.cd-=dt;
      if(e.st==='walk'){
        // 주변 선회
        const orb=toP+Math.PI/2*Math.sin(e.t*.8);
        e.a=aLerp(e.a,d>260?toP:orb,1-Math.pow(.01,dt));
        e.x+=Math.cos(e.a)*e.spd*dt; e.y+=Math.sin(e.a)*e.spd*dt;
        e.walk+=dt*16;
        if(e.cd<=0&&d<420){ e.st='tele'; e.tele=.45; }
      }else if(e.st==='tele'){
        e.tele-=dt; e.a=aLerp(e.a,toP,1-Math.pow(.01,dt));
        if(e.tele<=0){e.st='dash';e.t2=.5;}
      }else{
        e.t2-=dt;
        e.x+=Math.cos(e.a)*620*dt; e.y+=Math.sin(e.a)*620*dt;
        if(d<e.r+P.r){ hurtPlayer(e.dmg); e.t2=0; }
        if(e.t2<=0){e.st='walk';e.cd=rnd(2.4,1.2);}
      }
    }
    else if(T.kind==='gunner'){
      const want=250;
      const move=(d<want-50)?-1:(d>want+50?1:0);
      e.a=aLerp(e.a,toP,1-Math.pow(.004,dt));
      e.x+=Math.cos(e.a)*e.spd*move*dt; e.y+=Math.sin(e.a)*e.spd*move*dt;
      e.x+=Math.cos(e.a+Math.PI/2)*e.spd*.5*Math.sin(e.t*1.3)*dt;
      e.y+=Math.sin(e.a+Math.PI/2)*e.spd*.5*Math.sin(e.t*1.3)*dt;
      e.walk+=dt*9;
      e.cd-=dt;
      if(e.cd<=0&&d<520){
        e.cd=rnd(2.4,1.3);
        e.tele=.4; e.st='aim';
      }
      if(e.st==='aim'){
        e.tele-=dt;
        if(e.tele<=0){
          e.st='walk';
          const a=toP+rnd(.09,-.09);
          ebullets.push({x:e.x+Math.cos(a)*18,y:e.y+Math.sin(a)*18,vx:Math.cos(a)*430,vy:Math.sin(a)*430,r:6,dmg:e.dmg||13,life:2.2,t:0});
          spark(e.x+Math.cos(a)*18,e.y+Math.sin(a)*18,a,'#ffcf7a',5);
          SND.noise(.2,.1,900,1.2);
        }
      }
      if(d<e.r+P.r){ hurtPlayer(10); e.kb.x=-Math.cos(toP)*240; e.kb.y=-Math.sin(toP)*240; }
    }
    else if(T.kind==='boss'){
      e.cd-=dt;
      if(e.st==='walk'){
        const want=230;
        const move=(d<want-60)?-.6:(d>want+40?1:0);
        e.a=aLerp(e.a,toP,1-Math.pow(.01,dt));
        e.x+=Math.cos(e.a)*e.spd*move*dt; e.y+=Math.sin(e.a)*e.spd*move*dt;
        e.x+=Math.cos(e.a+Math.PI/2)*e.spd*.6*Math.sin(e.t*.9)*dt;
        e.y+=Math.sin(e.a+Math.PI/2)*e.spd*.6*Math.sin(e.t*.9)*dt;
        e.walk+=dt*7;
        if(e.cd<=0){
          e.phase=(e.phase+1)%3;
          e.st='tele'; e.tele=.6;
        }
      }else if(e.st==='tele'){
        e.tele-=dt;
        e.a=aLerp(e.a,toP,1-Math.pow(.01,dt));
        if(Math.random()<dt*22)spark(e.x,e.y,rnd(TAU),'#ff9c4a',2);
        if(e.tele<=0){
          if(e.phase===0){ // 방사 사격
            const n=14, base=toP;
            for(let k=0;k<n;k++){
              const a=base+k/n*TAU;
              ebullets.push({x:e.x+Math.cos(a)*40,y:e.y+Math.sin(a)*40,vx:Math.cos(a)*360,vy:Math.sin(a)*360,r:7,dmg:16,life:2.6,t:0,boss:true});
            }
            cam.shake=16; SND.shot('shotgun'); e.st='walk'; e.cd=rnd(2.6,1.7);
          }else if(e.phase===1){ // 돌진
            e.st='dash'; e.t2=.7; SND.boss();
          }else{ // 부하 소환
            for(let k=0;k<3;k++){
              const a=rnd(TAU), rr=95;
              spawnEnemy('rat');
              const n=enemies[enemies.length-1];
              n.x=clamp(e.x+Math.cos(a)*rr,60,AW-60);
              n.y=clamp(e.y+Math.sin(a)*rr,60,AH-60);
              for(let q=0;q<10;q++)puff(n.x,n.y,'#d9b377');
            }
            ring(e.x,e.y,'#ff9c4a',20,160,.5);
            e.st='walk'; e.cd=rnd(3,2);
          }
        }
      }else{
        e.t2-=dt;
        e.x+=Math.cos(e.a)*700*dt; e.y+=Math.sin(e.a)*700*dt;
        if(Math.random()<dt*70)puff(e.x,e.y,'#d8b07a',1.6);
        if(d<e.r+P.r){ hurtPlayer(e.dmg); e.t2=Math.min(e.t2,.05); }
        if(e.t2<=0){ e.st='walk'; e.cd=rnd(2.2,1.3); cam.shake=12; }
      }
    }

    pushOutProps(e,true);
    // 적끼리 밀림
    for(let j=i-1;j>=0;j--){
      const o=enemies[j]; if(o.type==='boss'&&e.type!=='boss')continue;
      const rr=e.r+o.r;
      const dd=dist2(e.x,e.y,o.x,o.y);
      if(dd<rr*rr&&dd>0.01){
        const dl=Math.sqrt(dd), nx=(e.x-o.x)/dl, ny=(e.y-o.y)/dl, push=(rr-dl)*.5;
        e.x+=nx*push; e.y+=ny*push; o.x-=nx*push; o.y-=ny*push;
      }
    }
    if(e.dead)enemies.splice(i,1);
  }

  /* --- 내 탄 --- */
  for(let i=bullets.length-1;i>=0;i--){
    const b=bullets[i];
    b.px=b.x;b.py=b.y;
    b.x+=b.vx*dt; b.y+=b.vy*dt; b.t+=dt;
    let gone=b.t>b.life||b.x<30||b.x>AW-30||b.y<30||b.y>AH-30;
    if(gone){ spark(b.x,b.y,Math.atan2(-b.vy,-b.vx),'#e8cfa0',4); decal(b.x,b.y); bullets.splice(i,1); continue; }
    // 프롭
    let blocked=false;
    for(const p of props){
      if(!solidProp(p))continue;
      const rr=p.r*p.s*0.7;
      if(dist2(b.x,b.y,p.x,p.y)<rr*rr){
        spark(b.x,b.y,Math.atan2(-b.vy,-b.vx),p.type==='rock'?'#d8d2c4':'#e8bb7a',7);
        decal(b.x,b.y);
        if(p.type==='barrel'){ p.hp-=b.dmg; if(p.hp<=0)explodeBarrel(p); }
        blocked=true;break;
      }
    }
    if(blocked){ bullets.splice(i,1); continue; }
    // 적
    for(const e of enemies){
      if(e.dead||b.hit.has(e))continue;
      const rr=e.r+b.r;
      if(dist2(b.x,b.y,e.x,e.y)<rr*rr){
        b.hit.add(e);
        damageEnemy(e,b.dmg,b.crit,b.px,b.py);
        if(b.pierce<=0){ bullets.splice(i,1); break; }
        b.pierce--; b.dmg*=.82;
      }
    }
  }

  /* --- 적 탄 --- */
  for(let i=ebullets.length-1;i>=0;i--){
    const b=ebullets[i];
    b.x+=b.vx*dt;b.y+=b.vy*dt;b.t+=dt;
    if(b.t>b.life||b.x<28||b.x>AW-28||b.y<28||b.y>AH-28){ebullets.splice(i,1);continue;}
    let hitProp=false;
    for(const p of props){ if(!solidProp(p))continue;
      const rr=p.r*p.s*0.7; if(dist2(b.x,b.y,p.x,p.y)<rr*rr){hitProp=true;break;} }
    if(hitProp){ spark(b.x,b.y,0,'#ffb27a',5); ebullets.splice(i,1); continue; }
    const rr=P.r+b.r;
    if(dist2(b.x,b.y,P.x,P.y)<rr*rr){
      if(P.dodgeT<=0&&P.inv<=0){ hurtPlayer(b.dmg); ebullets.splice(i,1); }
      else if(P.dodgeT>0){ floatText(P.x,P.y-26,'회피!','#9fe8ff',16); ebullets.splice(i,1); }
      continue;
    }
  }

  /* --- 픽업 --- */
  for(let i=pickups.length-1;i>=0;i--){
    const u=pickups[i];
    u.t+=dt;
    u.x+=u.vx*dt; u.y+=u.vy*dt;
    u.vx*=Math.pow(.002,dt); u.vy*=Math.pow(.002,dt);
    const d=Math.sqrt(dist2(u.x,u.y,P.x,P.y));
    // 자력 회수: 가까우면 끌려오고, 8초가 지나면 거리와 무관하게 날아온다
    if(u.t>8){
      const a=ang(u.x,u.y,P.x,P.y), pull=lerp(420,1000,clamp((u.t-8)/3,0,1));
      u.vx=Math.cos(a)*pull; u.vy=Math.sin(a)*pull;
    }else if(d<170&&u.t>.25){
      const a=ang(u.x,u.y,P.x,P.y),pull=lerp(760,180,d/170);
      u.vx+=Math.cos(a)*pull*dt*3; u.vy+=Math.sin(a)*pull*dt*3;
    }
    if(d<P.r+u.r){
      if(u.k==='coin'){ coins+=u.v; totalCoinsEarned+=u.v; SND.coin(); floatText(P.x,P.y-30,'+'+u.v,'#ffd45e',15); }
      else if(u.k==='heart'){ P.hp=Math.min(P.maxHp,P.hp+Math.round(P.maxHp*.22)); SND.coin(); floatText(P.x,P.y-30,'체력 회복','#ff8d7a',16); refreshHpUI(); }
      else { P.ammo=magMax(); P.reloading=0; document.getElementById('reloadBar').style.display='none'; SND.reload(); floatText(P.x,P.y-30,'재장전!','#9fe8ff',16); refreshAmmoUI(true); }
      pickups.splice(i,1);
    }
  }

  /* --- 파티클 --- */
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.t+=dt;
    if(p.t>=p.life){parts.splice(i,1);continue;}
    if(p.k==='puff'){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.02,dt);p.vy*=Math.pow(.02,dt); }
    else if(p.k==='spark'){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.004,dt);p.vy*=Math.pow(.004,dt); }
    else if(p.k==='fur'){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.01,dt);p.vy*=Math.pow(.01,dt);p.rot+=p.vr*dt; }
    else if(p.k==='shell'){ p.x+=p.vx*dt;p.y+=p.vy*dt;p.vx*=Math.pow(.2,dt);p.gz-=560*dt;p.z+=p.gz*dt;
      if(p.z<0){p.z=0;p.gz*=-.35;p.vx*=.5;p.vy*=.5;} p.rot+=p.vr*dt; }
  }
  for(let i=texts.length-1;i>=0;i--){ const t=texts[i]; t.t+=dt; t.y+=t.vy*dt; t.vy*=Math.pow(.2,dt); if(t.t>=t.life)texts.splice(i,1); }
  if(decals.length>170)decals.splice(0,decals.length-170);

  /* --- 회전초 / 모래 --- */
  for(const t of tumbles){
    t.x+=Math.cos(t.a)*t.sp*dt; t.y+=Math.sin(t.a)*t.sp*dt; t.rot+=dt*t.sp/t.r;
    if(t.x<-60)t.x=AW+60; if(t.x>AW+60)t.x=-60;
    if(t.y<-60)t.y=AH+60; if(t.y>AH+60)t.y=-60;
    if(Math.random()<dt*0.3)t.a+=rnd(.6,-.6);
  }
  for(const m of motes){
    m.x+=m.sp*dt; m.y+=Math.sin(runTime*2+m.x*0.01)*12*dt;
    if(m.x>AW+20)m.x=-20;
  }

  /* --- 콤보 / 시간 --- */
  if(comboT>0){ comboT-=dt; if(comboT<=0)combo=0; }
  timeScale=lerp(timeScale,1,dt*2.2);
  cam.shake*=Math.pow(.0025,dt);

  /* --- 카메라 --- */
  const look=90;
  const hw=VW/SCALE/2, hh=VH/SCALE/2;
  const tx=(hw*2>=AW)?AW/2:clamp(P.x+Math.cos(P.aim)*look, hw, AW-hw);
  const ty=(hh*2>=AH)?AH/2:clamp(P.y+Math.sin(P.aim)*look, hh, AH-hh);
  cam.x=lerp(cam.x,tx,1-Math.pow(.0008,dt));
  cam.y=lerp(cam.y,ty,1-Math.pow(.0008,dt));
  cam.sx=rnd(cam.shake,-cam.shake); cam.sy=rnd(cam.shake,-cam.shake);

  refreshHpUI(); refreshComboUI();
}

function decal(x,y){ decals.push({x,y,r:rnd(7,3),a:rnd(.28,.12)}); }
function explodeBarrel(p){
  p.type='gone';
  ring(p.x,p.y,'#ffb04a',10,130,.42);
  for(let i=0;i<26;i++)puff(p.x,p.y,'#e8a860',1.6);
  spark(p.x,p.y,rnd(TAU),'#ffd08a',22,1.8);
  cam.shake=Math.min(28,cam.shake+14);
  SND.noise(.55,.45,260,.6); SND.tone(140,40,.4,.4,'sawtooth');
  for(const e of enemies){
    const d=Math.sqrt(dist2(e.x,e.y,p.x,p.y));
    if(d<150)damageEnemy(e,90*(1-d/150)+20,true,p.x,p.y);
  }
  const dp=Math.sqrt(dist2(P.x,P.y,p.x,p.y));
  if(dp<130)hurtPlayer(16*(1-dp/130));
}

/* ---------------- 렌더 ---------------- */
function w2s(x,y){ return [ (x-cam.x)*SCALE+VW/2+cam.sx, (y-cam.y)*SCALE+VH/2+cam.sy ]; }

function draw(){
  const g=ctx;
  g.setTransform(DPR,0,0,DPR,0,0);
  g.clearRect(0,0,VW,VH);
  g.save();
  g.translate(VW/2+cam.sx, VH/2+cam.sy);
  g.scale(SCALE,SCALE);
  g.translate(-cam.x,-cam.y);

  // 보이는 영역
  const vw=VW/SCALE, vh=VH/SCALE;
  const vx0=cam.x-vw/2-40, vy0=cam.y-vh/2-40, vx1=cam.x+vw/2+40, vy1=cam.y+vh/2+40;
  const vis=(x,y,m=70)=>x>vx0-m&&x<vx1+m&&y>vy0-m&&y<vy1+m;

  // 지형
  if(ground)g.drawImage(ground,0,0);

  // 탄흔
  g.save();
  for(const d of decals){ g.fillStyle='rgba(60,36,16,'+d.a+')'; g.beginPath(); g.arc(d.x,d.y,d.r,0,TAU); g.fill(); }
  g.restore();

  // 모래 알갱이
  g.save();
  for(const m of motes){ if(!vis(m.x,m.y))continue; g.globalAlpha=.12*m.z; g.fillStyle='#fff4d8'; g.fillRect(m.x,m.y,2+m.z*2,1.6); }
  g.restore();

  // 그림자 (바닥) — 유닛
  g.save(); g.globalAlpha=.3; g.fillStyle='#4a2f14';
  for(const e of enemies){ if(!vis(e.x,e.y))continue; g.beginPath(); g.ellipse(e.x,e.y+e.r*.55,e.r*.95,e.r*.42,0,0,TAU); g.fill(); }
  g.beginPath(); g.ellipse(P.x,P.y+10,16,7,0,0,TAU); g.fill();
  g.restore();

  // 픽업
  for(const u of pickups){
    if(!vis(u.x,u.y))continue;
    const bob=Math.sin(u.t*6)*2.5;
    g.save(); g.translate(u.x,u.y+bob);
    if(u.k==='coin'){
      const sq=Math.abs(Math.cos(u.t*4));
      g.save(); g.scale(clamp(sq,.25,1),1);
      g.fillStyle='#ffd45e'; g.beginPath(); g.arc(0,0,8,0,TAU); g.fill();
      g.strokeStyle='#b07d1c'; g.lineWidth=2; g.stroke();
      g.fillStyle='#fff1b8'; g.beginPath(); g.arc(-2,-2,3,0,TAU); g.fill();
      g.restore();
    }else if(u.k==='heart'){
      g.fillStyle='#ff6f7d'; g.font='22px serif'; g.textAlign='center'; g.textBaseline='middle'; g.fillText('❤',0,0);
    }else{
      g.fillStyle='#6b4a2a'; g.fillRect(-10,-8,20,16);
      g.strokeStyle='#d8b37a'; g.lineWidth=2; g.strokeRect(-10,-8,20,16);
      g.fillStyle='#ffd45e'; g.fillRect(-5,-4,3,9); g.fillRect(-1,-4,3,9); g.fillRect(3,-4,3,9);
    }
    g.restore();
  }

  // 적
  for(const e of enemies){ if(vis(e.x,e.y,90))drawEnemy(g,e); }

  // 프롭
  for(const p of props){ if(p.type!=='gone'&&vis(p.x,p.y,90))drawProp(g,p); }

  // 회전초
  for(const t of tumbles){ if(!vis(t.x,t.y,80))continue;
    g.save(); g.translate(t.x,t.y); g.rotate(t.rot);
    g.strokeStyle='#8a6a34'; g.lineWidth=2;
    for(let i=0;i<9;i++){ const a=i/9*TAU; g.beginPath(); g.moveTo(0,0);
      g.lineTo(Math.cos(a)*t.r,Math.sin(a)*t.r*.8);
      g.lineTo(Math.cos(a+.5)*t.r*.7,Math.sin(a+.5)*t.r*.6); g.stroke(); }
    g.restore();
  }

  // 플레이어
  drawPlayer(g);

  // 탄
  for(const b of bullets){
    g.save();
    g.strokeStyle=b.col; g.lineWidth=b.crit?3.6:2.4; g.lineCap='round';
    g.globalAlpha=.95;
    g.beginPath(); g.moveTo(b.px,b.py); g.lineTo(b.x,b.y); g.stroke();
    g.globalAlpha=.3; g.lineWidth=b.crit?9:6; g.stroke();
    g.restore();
  }
  for(const b of ebullets){
    g.save(); g.translate(b.x,b.y);
    const gr=g.createRadialGradient(0,0,0,0,0,b.r*2.6);
    gr.addColorStop(0,b.boss?'#ffd0a0':'#ffb0b0'); gr.addColorStop(1,'#ff4a2a00');
    g.fillStyle=gr; g.beginPath(); g.arc(0,0,b.r*2.6,0,TAU); g.fill();
    g.fillStyle=b.boss?'#fff3d0':'#fff'; g.beginPath(); g.arc(0,0,b.r*.7,0,TAU); g.fill();
    g.restore();
  }

  // 파티클
  for(const p of parts){
    const k=1-p.t/p.life;
    g.save();
    if(p.k==='puff'){ g.globalAlpha=.4*k; g.fillStyle=p.col; g.beginPath(); g.arc(p.x,p.y,p.r*(1.6-k*.6),0,TAU); g.fill(); }
    else if(p.k==='spark'){ g.globalAlpha=k; g.strokeStyle=p.col; g.lineWidth=2.4; g.lineCap='round';
      const l=p.len*k; const a=Math.atan2(p.vy,p.vx);
      g.beginPath(); g.moveTo(p.x,p.y); g.lineTo(p.x-Math.cos(a)*l,p.y-Math.sin(a)*l); g.stroke(); }
    else if(p.k==='fur'){ g.globalAlpha=k; g.translate(p.x,p.y); g.rotate(p.rot); g.fillStyle=p.col;
      g.beginPath(); g.ellipse(0,0,p.r,p.r*.55,0,0,TAU); g.fill(); }
    else if(p.k==='shell'){ g.globalAlpha=Math.min(1,k*3); g.translate(p.x,p.y-p.z); g.rotate(p.rot);
      g.fillStyle='#e0b44a'; g.fillRect(-3.5,-1.6,7,3.2); g.fillStyle='#fff0b8'; g.fillRect(2,-1.6,1.6,3.2); }
    else if(p.k==='ring'){ g.globalAlpha=k*.8; g.strokeStyle=p.col; g.lineWidth=3*k+1;
      g.beginPath(); g.arc(p.x,p.y,lerp(p.r0,p.r1,1-k),0,TAU); g.stroke(); }
    g.restore();
  }

  // 데미지 숫자
  for(const t of texts){
    const k=1-t.t/t.life;
    g.save(); g.globalAlpha=clamp(k*1.6,0,1);
    g.font=(t.size*(t.crit?lerp(1.35,1,1-k):1))+'px Jua, sans-serif';
    g.textAlign='center'; g.lineWidth=4; g.strokeStyle='#3a1f08';
    g.strokeText(t.txt,t.x,t.y); g.fillStyle=t.col; g.fillText(t.txt,t.x,t.y);
    g.restore();
  }

  g.restore();

  // 석양 + 비네트
  const dusk=clamp((wave-1)/14,0,1);
  const og=g.createLinearGradient(0,0,0,VH);
  og.addColorStop(0,'rgba(255,'+Math.round(170-dusk*70)+','+Math.round(90-dusk*60)+','+(0.07+dusk*0.16).toFixed(3)+')');
  og.addColorStop(1,'rgba(40,10,60,'+(0.05+dusk*0.2).toFixed(3)+')');
  g.fillStyle=og; g.fillRect(0,0,VW,VH);
  const vg=g.createRadialGradient(VW/2,VH/2,Math.min(VW,VH)*.33,VW/2,VH/2,Math.max(VW,VH)*.78);
  vg.addColorStop(0,'#00000000'); vg.addColorStop(1,'rgba(20,8,2,0.62)');
  g.fillStyle=vg; g.fillRect(0,0,VW,VH);

  // 보스 체력바
  const boss=enemies.find(e=>e.type==='boss');
  if(boss){
    const w=Math.min(VW-60,480), x=(VW-w)/2, y=VH-(touchMode?150:72);
    g.save();
    g.fillStyle='#1b100acc'; g.strokeStyle='#8a5a2e'; g.lineWidth=2;
    roundRect(g,x-4,y-4,w+8,26,8); g.fill(); g.stroke();
    g.fillStyle='#2a1208'; roundRect(g,x,y,w,18,6); g.fill();
    const hg=g.createLinearGradient(x,0,x+w,0);
    hg.addColorStop(0,'#ffb36b'); hg.addColorStop(1,'#e03b1e');
    g.fillStyle=hg; roundRect(g,x,y,w*clamp(boss.hp/boss.maxHp,0,1),18,6); g.fill();
    g.fillStyle='#ffe9c9'; g.font='13px Jua, sans-serif'; g.textAlign='center';
    g.fillText('🐱 고양이 두목   '+Math.max(0,Math.ceil(boss.hp))+' / '+Math.ceil(boss.maxHp), VW/2, y+14);
    g.restore();
  }
}
function roundRect(g,x,y,w,h,r){
  g.beginPath();
  g.moveTo(x+r,y); g.arcTo(x+w,y,x+w,y+h,r); g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r); g.arcTo(x,y,x+w,y,r); g.closePath();
}

/* ---------------- 플레이어 그리기 ---------------- */
function drawPlayer(g){
  const bob=Math.sin(P.walk)*1.8;
  g.save();
  g.translate(P.x, P.y+bob);
  if(P.dodgeT>0) g.rotate(P.dodgeAng+ (1-P.dodgeT/.3)*TAU);
  else g.rotate(P.face+Math.PI/2);

  const flash=P.hurtFlash>0;
  const fur1=flash?'#ffffff':'#f2d9ae', fur2=flash?'#ffeeee':'#e0c08a';
  if(P.inv>0&&P.dodgeT<=0) g.globalAlpha=0.55+0.45*Math.sin(runTime*40);

  // 꼬리
  g.strokeStyle=fur2; g.lineWidth=5; g.lineCap='round';
  g.beginPath(); g.moveTo(0,15); g.quadraticCurveTo(Math.sin(P.walk*.6)*9,25,Math.sin(P.walk*.6)*13,30); g.stroke();

  // 발
  const fw=Math.sin(P.walk)*4;
  g.fillStyle='#e8b98a';
  g.beginPath(); g.ellipse(-10,10+fw,5,4,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(10,10-fw,5,4,0,0,TAU); g.fill();

  // 몸
  const bg=g.createRadialGradient(-5,-8,2,0,0,22);
  bg.addColorStop(0,flash?'#fff':'#fbe9c8'); bg.addColorStop(1,fur1);
  g.fillStyle=bg;
  g.beginPath(); g.ellipse(0,0,16,18,0,0,TAU); g.fill();
  g.strokeStyle=flash?'#fff':'#c9a173'; g.lineWidth=1.6; g.stroke();
  // 등 무늬
  g.fillStyle=flash?'#ffecec':'#d8b282';
  g.beginPath(); g.ellipse(0,4,10,11,0,0,TAU); g.fill();

  // 스카프 (바람에 흔들림)
  g.fillStyle='#d9452f';
  g.beginPath(); g.ellipse(0,-5,13,5,0,0,TAU); g.fill();
  g.beginPath();
  g.moveTo(-3,-3);
  g.quadraticCurveTo(-10+Math.sin(runTime*8)*4, 7, -6+Math.sin(runTime*8)*7, 15);
  g.lineTo(-1,6); g.closePath(); g.fill();

  // 귀
  g.fillStyle=fur2;
  g.beginPath(); g.ellipse(-11,-13,6,7,-.4,0,TAU); g.fill();
  g.beginPath(); g.ellipse(11,-13,6,7,.4,0,TAU); g.fill();
  g.fillStyle='#f0a9a0';
  g.beginPath(); g.ellipse(-11,-13,3,3.6,-.4,0,TAU); g.fill();
  g.beginPath(); g.ellipse(11,-13,3,3.6,.4,0,TAU); g.fill();

  // 머리
  const hg2=g.createRadialGradient(-3,-20,1,0,-16,14);
  hg2.addColorStop(0,flash?'#fff':'#fdf0d6'); hg2.addColorStop(1,fur1);
  g.fillStyle=hg2;
  g.beginPath(); g.ellipse(0,-15,13,12,0,0,TAU); g.fill();
  // 볼주머니
  g.fillStyle=flash?'#fff':'#f8e2bb';
  g.beginPath(); g.ellipse(-10,-12,5.5,5,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(10,-12,5.5,5,0,0,TAU); g.fill();
  // 눈
  g.fillStyle='#2b1a10';
  g.beginPath(); g.ellipse(-4.6,-19,2.5,3,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(4.6,-19,2.5,3,0,0,TAU); g.fill();
  g.fillStyle='#fff';
  g.beginPath(); g.arc(-5.4,-20.2,.95,0,TAU); g.fill();
  g.beginPath(); g.arc(3.8,-20.2,.95,0,TAU); g.fill();
  // 코
  g.fillStyle='#e07a6a';
  g.beginPath(); g.ellipse(0,-23.5,2,1.5,0,0,TAU); g.fill();

  // 카우보이 모자
  g.fillStyle='#6b4423';
  g.beginPath(); g.ellipse(0,-17,17,8,0,0,TAU); g.fill();
  g.fillStyle='#7d5129';
  g.beginPath(); g.ellipse(0,-22,9.5,7.5,0,0,TAU); g.fill();
  g.fillStyle='#4a2d14';
  g.beginPath(); g.ellipse(0,-18.5,10,3,0,0,TAU); g.fill();
  g.fillStyle='#ffd45e';
  g.beginPath(); g.arc(0,-18.5,1.8,0,TAU); g.fill();

  // 총 (앞쪽) + 반동
  const kick=P.kick*0.5;
  g.save();
  g.translate(0,-26-kick);
  const G=GUNS[P.gun];
  g.fillStyle='#45342a';
  if(G.id==='shotgun'){ g.fillRect(-4,-14,8,16); g.fillStyle='#8a6a3a'; g.fillRect(-3,0,6,7); }
  else if(G.id==='rifle'){ g.fillRect(-2.6,-20,5.2,22); g.fillStyle='#8a6a3a'; g.fillRect(-3.4,-1,6.8,8); }
  else if(G.id==='gatling'){ g.fillStyle='#3c3c42'; g.fillRect(-7,-16,14,18);
    g.fillStyle='#6a6a74'; for(let i=-2;i<=2;i++)g.fillRect(i*2.6-1,-19,2,6); }
  else if(G.id==='dual'){ g.fillStyle='#45342a'; g.fillRect(-11,-11,5,12); g.fillRect(6,-11,5,12);
    g.fillStyle='#8a6a3a'; g.fillRect(-11,0,5,5); g.fillRect(6,0,5,5); }
  else { g.fillRect(-2.4,-12,4.8,13); g.fillStyle='#8a6a3a'; g.fillRect(-3.2,0,6.4,6);
    g.fillStyle='#6a6a74'; g.beginPath(); g.arc(0,-2,3.4,0,TAU); g.fill(); }
  g.restore();

  // 손
  g.fillStyle='#e8b98a';
  g.beginPath(); g.ellipse(-5,-22,3.6,3.2,0,0,TAU); g.fill();
  g.beginPath(); g.ellipse(5,-22,3.6,3.2,0,0,TAU); g.fill();

  g.restore();

  // 회피 잔상
  if(P.dodgeT>0){
    g.save(); g.globalAlpha=.25; g.fillStyle='#9fe8ff';
    g.beginPath(); g.arc(P.x,P.y,20+(1-P.dodgeT/.3)*10,0,TAU); g.fill(); g.restore();
  }
  // 조준 가이드
  if(!touchMode){
    g.save(); g.globalAlpha=.22; g.strokeStyle='#fff3d0'; g.lineWidth=1.6; g.setLineDash([7,9]);
    g.beginPath(); g.moveTo(P.x+Math.cos(P.aim)*26,P.y+Math.sin(P.aim)*26);
    g.lineTo(P.x+Math.cos(P.aim)*330,P.y+Math.sin(P.aim)*330); g.stroke(); g.restore();
  }
}

/* ---------------- 적 그리기 ---------------- */
function drawEnemy(g,e){
  const T=ETYPE[e.type];
  g.save();
  g.translate(e.x,e.y);
  g.scale(e.scale,e.scale);
  g.rotate(e.a+Math.PI/2);
  const f=e.flash>0;
  const col=f?'#fff':T.col;
  const dark=f?'#fff':shade(T.col,-28);

  if(e.type==='rat'){
    const bob=Math.sin(e.walk)*2;
    g.strokeStyle=dark; g.lineWidth=3; g.lineCap='round';
    g.beginPath(); g.moveTo(0,14); g.quadraticCurveTo(Math.sin(e.walk)*8,24,Math.sin(e.walk)*12,30); g.stroke();
    g.fillStyle=col; g.beginPath(); g.ellipse(0,bob*.3,13,15,0,0,TAU); g.fill();
    g.fillStyle=dark; g.beginPath(); g.ellipse(-9,-11,5,6,-.4,0,TAU); g.fill();
    g.beginPath(); g.ellipse(9,-11,5,6,.4,0,TAU); g.fill();
    g.fillStyle=col; g.beginPath(); g.ellipse(0,-13,11,10,0,0,TAU); g.fill();
    // 두건
    g.fillStyle='#8d2f24'; g.beginPath(); g.ellipse(0,-17,11,5,0,0,TAU); g.fill();
    g.fillStyle='#d33'; g.beginPath(); g.ellipse(-3.8,-17,2,2.2,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(3.8,-17,2,2.2,0,0,TAU); g.fill();
    g.fillStyle='#e07a6a'; g.beginPath(); g.ellipse(0,-21,1.8,1.4,0,0,TAU); g.fill();
  }
  else if(e.type==='snake'){
    g.fillStyle=col;
    for(let i=6;i>=0;i--){
      const a=e.walk-i*.5, r=12-i*1.4;
      g.beginPath(); g.ellipse(Math.sin(a)*5, 6+i*5, Math.max(2,r*.8), Math.max(2,r*.7),0,0,TAU); g.fill();
    }
    g.fillStyle=f?'#fff':shade(T.col,16);
    g.beginPath(); g.ellipse(0,-4,10,9,0,0,TAU); g.fill();
    g.fillStyle='#2b1a10'; g.beginPath(); g.arc(-3.4,-7,1.8,0,TAU); g.fill();
    g.beginPath(); g.arc(3.4,-7,1.8,0,TAU); g.fill();
    g.strokeStyle='#d33'; g.lineWidth=1.6;
    g.beginPath(); g.moveTo(0,-12); g.lineTo(-2.6,-18); g.moveTo(0,-12); g.lineTo(2.6,-18); g.stroke();
  }
  else if(e.type==='scorp'){
    const tel=e.st==='tele';
    if(tel){ g.save(); g.globalAlpha=.35+Math.sin(runTime*34)*.25; g.fillStyle='#ff5a3a';
      g.beginPath(); g.arc(0,0,e.r+12,0,TAU); g.fill(); g.restore(); }
    g.fillStyle=dark;
    for(let i=0;i<3;i++){ const a=e.walk+i;
      g.save(); g.rotate(0); g.lineWidth=3; g.strokeStyle=dark;
      g.beginPath(); g.moveTo(-11,-4+i*7); g.lineTo(-20,-8+i*7+Math.sin(a)*3); g.stroke();
      g.beginPath(); g.moveTo(11,-4+i*7); g.lineTo(20,-8+i*7-Math.sin(a)*3); g.stroke();
      g.restore(); }
    // 꼬리
    g.strokeStyle=dark; g.lineWidth=6;
    g.beginPath(); g.moveTo(0,14);
    g.quadraticCurveTo(10,26,2+Math.sin(e.walk*.7)*5,30); g.stroke();
    g.fillStyle='#ffd45e'; g.beginPath(); g.arc(2+Math.sin(e.walk*.7)*5,32,4,0,TAU); g.fill();
    g.fillStyle=col; g.beginPath(); g.ellipse(0,2,16,17,0,0,TAU); g.fill();
    g.fillStyle=shade(T.col,f?60:-10); g.beginPath(); g.ellipse(0,0,10,12,0,0,TAU); g.fill();
    // 집게
    g.fillStyle=dark;
    g.beginPath(); g.ellipse(-15,-14+Math.sin(e.walk)*2,7,5,-.5,0,TAU); g.fill();
    g.beginPath(); g.ellipse(15,-14-Math.sin(e.walk)*2,7,5,.5,0,TAU); g.fill();
    g.fillStyle='#2b1a10'; g.beginPath(); g.arc(-4,-8,2,0,TAU); g.fill(); g.beginPath(); g.arc(4,-8,2,0,TAU); g.fill();
  }
  else if(e.type==='vulture'){
    const flap=Math.sin(e.walk)*0.7;
    const tel=e.st==='tele';
    if(tel){ g.save(); g.globalAlpha=.3+Math.sin(runTime*30)*.2; g.fillStyle='#ffd45e';
      g.beginPath(); g.arc(0,0,e.r+14,0,TAU); g.fill(); g.restore(); }
    g.fillStyle=dark;
    g.save(); g.rotate(flap); g.beginPath(); g.ellipse(-20,0,20,7,0,0,TAU); g.fill(); g.restore();
    g.save(); g.rotate(-flap); g.beginPath(); g.ellipse(20,0,20,7,0,0,TAU); g.fill(); g.restore();
    g.fillStyle=col; g.beginPath(); g.ellipse(0,2,11,15,0,0,TAU); g.fill();
    g.fillStyle=f?'#fff':'#d6cfc0'; g.beginPath(); g.ellipse(0,-12,8,7,0,0,TAU); g.fill();
    g.fillStyle='#e8a33c'; g.beginPath(); g.moveTo(0,-16); g.lineTo(-3,-24); g.lineTo(3,-24); g.closePath(); g.fill();
    g.fillStyle='#2b1a10'; g.beginPath(); g.arc(-3,-14,1.7,0,TAU); g.fill(); g.beginPath(); g.arc(3,-14,1.7,0,TAU); g.fill();
  }
  else if(e.type==='mole'){
    const aiming=e.st==='aim';
    g.fillStyle=col; g.beginPath(); g.ellipse(0,0,14,16,0,0,TAU); g.fill();
    g.fillStyle=shade(T.col,f?60:-16); g.beginPath(); g.ellipse(0,3,9,11,0,0,TAU); g.fill();
    g.fillStyle=col; g.beginPath(); g.ellipse(0,-13,11,10,0,0,TAU); g.fill();
    // 고글
    g.fillStyle='#2b2b33'; g.fillRect(-11,-17,22,6);
    g.fillStyle=aiming?'#ff6a4a':'#8fd6ff';
    g.beginPath(); g.arc(-5,-14,3,0,TAU); g.fill(); g.beginPath(); g.arc(5,-14,3,0,TAU); g.fill();
    g.fillStyle='#f0a9a0'; g.beginPath(); g.ellipse(0,-21,3,2.2,0,0,TAU); g.fill();
    // 총
    g.save(); g.translate(0,-22);
    g.fillStyle='#3a2a20'; g.fillRect(-2,-12,4,13);
    if(aiming){ g.fillStyle='#ffcf7a'; g.beginPath(); g.arc(0,-13,3+Math.sin(runTime*40)*1.4,0,TAU); g.fill(); }
    g.restore();
  }
  else if(e.type==='boss'){
    const tel=e.st==='tele';
    if(tel){ g.save(); g.globalAlpha=.3+Math.sin(runTime*26)*.22; g.fillStyle='#ff6a2a';
      g.beginPath(); g.arc(0,0,e.r+22,0,TAU); g.fill(); g.restore(); }
    // 꼬리
    g.strokeStyle=dark; g.lineWidth=11; g.lineCap='round';
    g.beginPath(); g.moveTo(0,36); g.quadraticCurveTo(Math.sin(e.walk)*34,56,Math.sin(e.walk)*46,42); g.stroke();
    // 망토
    g.fillStyle='#5a1f2a';
    g.beginPath(); g.moveTo(-30,-8); g.quadraticCurveTo(0,52+Math.sin(e.walk)*6,30,-8); g.closePath(); g.fill();
    // 몸
    const bgg=g.createRadialGradient(-10,-14,4,0,0,52);
    bgg.addColorStop(0,f?'#fff':shade(T.col,22)); bgg.addColorStop(1,col);
    g.fillStyle=bgg; g.beginPath(); g.ellipse(0,0,36,40,0,0,TAU); g.fill();
    g.strokeStyle=dark; g.lineWidth=2.5; g.stroke();
    // 배
    g.fillStyle=f?'#fff':'#f3e3c4'; g.beginPath(); g.ellipse(0,8,20,22,0,0,TAU); g.fill();
    // 머리
    g.fillStyle=col; g.beginPath(); g.ellipse(0,-34,28,25,0,0,TAU); g.fill();
    // 귀
    g.fillStyle=col;
    g.beginPath(); g.moveTo(-24,-46); g.lineTo(-13,-60); g.lineTo(-7,-44); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(24,-46); g.lineTo(13,-60); g.lineTo(7,-44); g.closePath(); g.fill();
    g.fillStyle='#f0a9a0';
    g.beginPath(); g.moveTo(-20,-47); g.lineTo(-14,-55); g.lineTo(-11,-46); g.closePath(); g.fill();
    g.beginPath(); g.moveTo(20,-47); g.lineTo(14,-55); g.lineTo(11,-46); g.closePath(); g.fill();
    // 눈
    g.fillStyle='#ffe066'; g.beginPath(); g.ellipse(-10,-38,7,8,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(10,-38,7,8,0,0,TAU); g.fill();
    g.fillStyle='#1a0d06';
    g.beginPath(); g.ellipse(-10,-38,2.4,7,0,0,TAU); g.fill();
    g.beginPath(); g.ellipse(10,-38,2.4,7,0,0,TAU); g.fill();
    // 코 + 수염
    g.fillStyle='#e07a6a'; g.beginPath(); g.moveTo(0,-30); g.lineTo(-4,-26); g.lineTo(4,-26); g.closePath(); g.fill();
    g.strokeStyle='#fff8e8'; g.lineWidth=1.4;
    for(let i=-1;i<=1;i++){ g.beginPath(); g.moveTo(-6,-27+i*3); g.lineTo(-26,-31+i*5); g.stroke();
      g.beginPath(); g.moveTo(6,-27+i*3); g.lineTo(26,-31+i*5); g.stroke(); }
    // 솜브레로
    g.fillStyle='#6b4423'; g.beginPath(); g.ellipse(0,-44,40,15,0,0,TAU); g.fill();
    g.fillStyle='#7d5129'; g.beginPath(); g.ellipse(0,-54,20,14,0,0,TAU); g.fill();
    g.fillStyle='#b8352a'; g.beginPath(); g.ellipse(0,-47,21,5,0,0,TAU); g.fill();
    // 쌍권총
    g.save(); g.translate(-30,-12); g.rotate(-.3);
    g.fillStyle='#3a2a20'; g.fillRect(-3,-16,6,18); g.restore();
    g.save(); g.translate(30,-12); g.rotate(.3);
    g.fillStyle='#3a2a20'; g.fillRect(-3,-16,6,18); g.restore();
  }
  g.restore();

  // 체력바 (보스 제외)
  if(e.type!=='boss'&&e.hp<e.maxHp){
    const w=e.r*2.1, x=e.x-w/2, y=e.y-e.r-12;
    g.fillStyle='#1b100aaa'; g.fillRect(x-1,y-1,w+2,6);
    g.fillStyle=e.hp/e.maxHp>.5?'#8fd96a':e.hp/e.maxHp>.25?'#ffd45e':'#e4572e';
    g.fillRect(x,y,w*clamp(e.hp/e.maxHp,0,1),4);
  }
}
function shade(hex,amt){
  const n=parseInt(hex.slice(1),16);
  let r=clamp((n>>16)+amt,0,255),gg=clamp(((n>>8)&255)+amt,0,255),b=clamp((n&255)+amt,0,255);
  return '#'+((1<<24)+(r<<16)+(gg<<8)+b).toString(16).slice(1);
}

/* ---------------- 프롭 그리기 ---------------- */
function drawProp(g,p){
  g.save(); g.translate(p.x,p.y); g.scale(p.s,p.s);
  if(p.type==='cactus'){
    g.fillStyle='#3f7a46';
    roundRect(g,-9,-52,18,56,9); g.fill();
    g.fillStyle='#356b3c'; roundRect(g,-4,-50,5,52,3); g.fill();
    g.fillStyle='#3f7a46';
    roundRect(g,-26,-38,15,10,6); g.fill(); roundRect(g,-26,-38,9,24,5); g.fill();
    roundRect(g,13,-30,14,10,6); g.fill(); roundRect(g,19,-30,9,20,5); g.fill();
    g.strokeStyle='#dfe8c8'; g.lineWidth=1;
    for(let i=0;i<16;i++){ const y=-50+i*3.4; g.beginPath(); g.moveTo(-7,y); g.lineTo(-11,y-2); g.stroke();
      g.beginPath(); g.moveTo(7,y); g.lineTo(11,y-2); g.stroke(); }
    g.fillStyle='#ff6f9c'; g.beginPath(); g.arc(0,-54,4,0,TAU); g.fill();
  }
  else if(p.type==='rock'){
    g.save(); g.rotate(p.rot);
    g.fillStyle='#9a9387'; g.beginPath();
    g.moveTo(-26,8); g.lineTo(-18,-16); g.lineTo(2,-24); g.lineTo(22,-12); g.lineTo(26,8); g.closePath(); g.fill();
    g.fillStyle='#b4ada0'; g.beginPath();
    g.moveTo(-18,-16); g.lineTo(2,-24); g.lineTo(6,-8); g.lineTo(-10,-4); g.closePath(); g.fill();
    g.strokeStyle='#6f685d'; g.lineWidth=2; g.beginPath();
    g.moveTo(-26,8); g.lineTo(-18,-16); g.lineTo(2,-24); g.lineTo(22,-12); g.lineTo(26,8); g.closePath(); g.stroke();
    g.restore();
  }
  else if(p.type==='barrel'){
    g.fillStyle='#6b4423'; roundRect(g,-17,-34,34,40,7); g.fill();
    g.fillStyle='#86552b'; roundRect(g,-13,-32,26,36,5); g.fill();
    g.fillStyle='#4a2d14'; g.fillRect(-17,-26,34,5); g.fillRect(-17,-8,34,5);
    g.fillStyle='#caa05e'; g.beginPath(); g.ellipse(0,-34,17,6,0,0,TAU); g.fill();
    g.fillStyle='#d9452f'; g.font='11px Jua, sans-serif'; g.textAlign='center'; g.fillText('TNT',0,-15);
    if(p.hp<34){ g.strokeStyle='#2b1a10'; g.lineWidth=1.6;
      g.beginPath(); g.moveTo(-8,-28); g.lineTo(-2,-18); g.lineTo(-9,-10); g.stroke(); }
  }
  else if(p.type==='skull'){
    g.save(); g.rotate(p.rot);
    g.fillStyle='#e8e2d2'; g.beginPath(); g.ellipse(0,0,13,11,0,0,TAU); g.fill();
    g.fillStyle='#d6cfbd'; g.beginPath(); g.ellipse(0,7,7,6,0,0,TAU); g.fill();
    g.fillStyle='#8d8676'; g.beginPath(); g.arc(-5,-2,3.4,0,TAU); g.fill(); g.beginPath(); g.arc(5,-2,3.4,0,TAU); g.fill();
    g.strokeStyle='#e8e2d2'; g.lineWidth=5; g.lineCap='round';
    g.beginPath(); g.moveTo(-11,-5); g.quadraticCurveTo(-24,-12,-20,-20); g.stroke();
    g.beginPath(); g.moveTo(11,-5); g.quadraticCurveTo(24,-12,20,-20); g.stroke();
    g.restore();
  }
  else if(p.type==='wagon'){
    g.fillStyle='#5a3a24'; roundRect(g,-38,-20,76,30,5); g.fill();
    g.fillStyle='#e8dcc0'; g.beginPath(); g.ellipse(0,-22,34,24,0,Math.PI,0); g.fill();
    g.strokeStyle='#c6b795'; g.lineWidth=2;
    for(let i=-2;i<=2;i++){ g.beginPath(); g.ellipse(i*11,-22,2,24,0,Math.PI,0); g.stroke(); }
    g.fillStyle='#3a2418';
    for(const wx of [-26,26]){ g.beginPath(); g.arc(wx,12,12,0,TAU); g.fill();
      g.strokeStyle='#8a6a3a'; g.lineWidth=2;
      for(let i=0;i<6;i++){ const a=i/6*Math.PI; g.beginPath();
        g.moveTo(wx+Math.cos(a)*11,12+Math.sin(a)*11); g.lineTo(wx-Math.cos(a)*11,12-Math.sin(a)*11); g.stroke(); } }
  }
  g.restore();
}

/* ---------------- 배너 / HUD 갱신 ---------------- */
let bannerT=0;
function banner(a,b){
  const el=document.getElementById('waveBanner');
  el.querySelector('.wb1').textContent=a;
  el.querySelector('.wb2').textContent=b;
  el.style.opacity='1'; el.style.transform='translate(-50%,-50%) scale(1)';
  bannerT=2.1;
}
function refreshHpUI(){
  const pc=clamp(P.hp/P.maxHp,0,1)*100;
  document.getElementById('hpFill').style.width=pc+'%';
  document.getElementById('hpTxt').textContent=Math.ceil(P.hp)+' / '+P.maxHp;
  document.getElementById('coinNum').textContent=coins;
}
let lastAmmo=-1,lastGun=-1;
function refreshAmmoUI(force){
  const G=GUNS[P.gun], mm=magMax();
  if(force||P.gun!==lastGun){
    lastGun=P.gun;
    document.getElementById('gname').textContent=G.ic+' '+G.name;
    const d=document.getElementById('ammoDots'); d.innerHTML='';
    for(let i=0;i<Math.min(mm,34);i++){ const s=document.createElement('div'); s.className='dot'; d.appendChild(s); }
  }
  const dots=document.getElementById('ammoDots').children;
  const shown=Math.min(mm,34);
  const onCount=Math.round(P.ammo/mm*shown);
  for(let i=0;i<dots.length;i++)dots[i].className='dot'+(i<onCount?' on':'');
  document.getElementById('ammoNum').textContent=P.ammo+' / '+mm+(mm>34?' (요약)':'');
  lastAmmo=P.ammo;
}
function refreshComboUI(){
  const el=document.getElementById('combo');
  if(combo>=3){ el.style.opacity='1'; el.querySelector('.cn').textContent=combo+'연속'; }
  else el.style.opacity='0';
  const du=document.getElementById('dodgeUI');
  if(P.dodgeCd<=0){ du.classList.add('ready'); document.getElementById('dodgeTxt').textContent='회피'; }
  else { du.classList.remove('ready'); document.getElementById('dodgeTxt').textContent=P.dodgeCd.toFixed(1)+'초'; }
}

/* ---------------- 상점 ---------------- */
const SHOP=[
  {k:'hp',   ic:'❤️', n:'튼튼한 몸', d:'최대 체력 +22 (즉시 회복)', base:55, step:1.42},
  {k:'dmg',  ic:'💪', n:'화력 강화', d:'모든 피해량 +13%',           base:70, step:1.48},
  {k:'spd',  ic:'🥾', n:'날랜 발',   d:'이동 속도 +7.5%',            base:55, step:1.44},
  {k:'rel',  ic:'🔄', n:'빠른 손',   d:'재장전 속도 +14%',           base:60, step:1.42},
  {k:'mag',  ic:'📦', n:'큰 탄창',   d:'장탄수 +28%',                base:60, step:1.44},
  {k:'crit', ic:'🎯', n:'명사수',    d:'치명타 확률 +5.5% (2.2배)',  base:80, step:1.5},
  {k:'dodge',ic:'🌀', n:'구르기 숙련',d:'회피 쿨타임 -13%',          base:65, step:1.46},
  {k:'pierce',ic:'➡️',n:'관통탄',    d:'모든 탄이 적 1명 더 관통',   base:170,step:1.9, max:3},
  {k:'luck', ic:'🍀', n:'행운',      d:'코인 +10%, 회복 드랍 증가',  base:70, step:1.45}
];
function price(it){ return Math.round(it.base*Math.pow(it.step,UPG[it.k])); }

function openShop(){
  state='shop';
  const c=document.getElementById('ovCard');
  const heal=`<div class="hint">웨이브 사이에 체력이 15% 자동 회복됩니다.</div>`;
  let items=SHOP.map(it=>{
    const lv=UPG[it.k], mx=it.max||99, p=price(it);
    const full=lv>=mx;
    const can=!full&&coins>=p;
    return `<div class="item ${full?'no':(can?'can':'no')}" data-u="${it.k}">
      <div class="lv">${full?'MAX':'Lv.'+lv}</div>
      <div class="ii">${it.ic}</div><div class="it">${it.n}</div>
      <div class="id">${it.d}</div>
      <div class="ip">${full?'—':'🪙 '+p}</div></div>`;
  }).join('');
  let guns=GUNS.filter(g=>!owned[g.id]).map(g=>
    `<div class="item ${coins>=g.cost?'can':'no'}" data-g="${g.id}">
      <div class="lv">무기</div>
      <div class="ii">${g.ic}</div><div class="it">${g.name}</div>
      <div class="id">${g.desc}</div>
      <div class="ip">🪙 ${g.cost}</div></div>`).join('');

  c.innerHTML=`
    <h2>🏪 사막 잡화점</h2>
    <div class="sub">웨이브 ${wave} 돌파!<br>보유 코인 <span id="shopCoins">🪙 ${coins}</span></div>
    <div id="shopGrid">${guns}${items}</div>
    ${heal}
    <button class="btn" id="goNext">다음 웨이브 ▶</button>
    <div class="hint">PC: 1~5 무기 교체 · R 재장전 · Shift 회피<br>모바일: 왼쪽 드래그 이동 · 오른쪽 드래그 조준/사격</div>`;
  document.getElementById('ov').classList.add('on');

  c.querySelectorAll('[data-u]').forEach(el=>el.onclick=()=>{
    const it=SHOP.find(s=>s.k===el.dataset.u);
    const mx=it.max||99;
    if(UPG[it.k]>=mx)return;
    const p=price(it);
    if(coins<p){ SND.noise(.2,.08,300,1); return; }
    coins-=p; UPG[it.k]++;
    if(it.k==='hp'){ const s=baseStats(); const add=s.maxHp-P.maxHp; P.maxHp=s.maxHp; P.hp=Math.min(P.maxHp,P.hp+add+10); }
    if(it.k==='mag'){ P.ammo=magMax(); }
    SND.buy(); openShop();
  });
  c.querySelectorAll('[data-g]').forEach(el=>el.onclick=()=>{
    const g=GUNS.find(x=>x.id===el.dataset.g);
    if(coins<g.cost){ SND.noise(.2,.08,300,1); return; }
    coins-=g.cost; owned[g.id]=true;
    P.gun=GUNS.indexOf(g); P.ammo=magMax(); P.reloading=0;
    SND.buy(); refreshAmmoUI(true); openShop();
  });
  document.getElementById('goNext').onclick=()=>{
    P.hp=Math.min(P.maxHp,P.hp+P.maxHp*0.15);
    P.ammo=magMax(); P.reloading=0;
    document.getElementById('reloadBar').style.display='none';
    document.getElementById('ov').classList.remove('on');
    state='play'; refreshHpUI(); refreshAmmoUI(true);
    nextWave();
  };
  refreshHpUI();
}

function gameOver(){

  state='dead'; SND.dead(); timeScale=.25;
  if(wave>best){ best=wave; localStorage.setItem('hg_best',best); }
  setTimeout(()=>{
    const c=document.getElementById('ovCard');
    c.innerHTML=`
      <h2>☠️ 쓰러졌다</h2>
      <div class="sub">모래가 모자를 덮었다...</div>

        <div class="stat"><div class="sv">${wave}</div><div class="sl">도달 웨이브</div></div>

        <div class="stat"><div class="sv">${Math.floor(runTime)}초</div><div class="sl">생존 시간</div></div>

      <div class="sub">최고 기록 <span class="gold">웨이브 ${best}</span>${wave>=best?'<span class="tag">신기록!</span>':''}</div>

/* ---------------- 입력 ---------------- */
const keys={};
let shooting=false;
const mouse={x:0,y:0,wx:0,wy:0,inside:false};
let touchMode=('ontouchstart' in window)||navigator.maxTouchPoints>0;
if(touchMode)document.getElementById('touch').classList.add('on');

addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  keys[k]=true;
  if(['arrowup','arrowdown','arrowleft','arrowright',' '].includes(k))e.preventDefault();
  if(state!=='play')return;
  if(k==='r')startReload();
  if(k==='shift'||k===' ')doDodge();
  if(k==='q')swapGun(1);
  if(k>='1'&&k<='5'){ const i=+k-1; if(GUNS[i]&&owned[GUNS[i].id]&&i!==P.gun){ P.gun=i; P.ammo=magMax(); P.reloading=0; P.spin=0;
    document.getElementById('reloadBar').style.display='none'; refreshAmmoUI(true); SND.noise(.2,.06,1400,2);} }
});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false;});
function doDodge(){
  if(P.dodgeCd>0||P.dodgeT>0)return;
  let mx=0,my=0;
  if(keys['w']||keys['arrowup'])my-=1;
  if(keys['s']||keys['arrowdown'])my+=1;
  if(keys['a']||keys['arrowleft'])mx-=1;
  if(keys['d']||keys['arrowright'])mx+=1;
  if(tl.active){mx+=tl.x;my+=tl.y;}
  P.dodgeAng=(mx||my)?Math.atan2(my,mx):P.aim;
  P.dodgeT=.3; P.dodgeCd=baseStats().dodgeCd; P.inv=.36;
  for(let i=0;i<10;i++)puff(P.x,P.y,'#e3c492');
  SND.dodge();
}

cv.addEventListener('mousemove',e=>{
  const r=cv.getBoundingClientRect();
  mouse.x=e.clientX-r.left; mouse.y=e.clientY-r.top; mouse.inside=true;
  mouse.wx=(mouse.x-VW/2-cam.sx)/SCALE+cam.x;
  mouse.wy=(mouse.y-VH/2-cam.sy)/SCALE+cam.y;
});
cv.addEventListener('mouseleave',()=>mouse.inside=false);
cv.addEventListener('mousedown',e=>{ if(e.button===0){shooting=true;SND.init();SND.resume();} if(e.button===2)doDodge(); });
addEventListener('mouseup',e=>{ if(e.button===0)shooting=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());
cv.addEventListener('wheel',e=>{ if(state==='play'){e.preventDefault();swapGun(e.deltaY>0?1:-1);} },{passive:false});

/* 터치 조이스틱 */
const tl={active:false,id:null,ox:0,oy:0,x:0,y:0};
const tr={active:false,id:null,ox:0,oy:0,x:1,y:0};
const stkL=document.getElementById('stkL'), stkR=document.getElementById('stkR');
function setStick(el,st,px,py,kx,ky){
  el.style.left=(st.ox-66)+'px'; el.style.top=(st.oy-66)+'px';
  el.querySelector('.kn').style.transform=`translate(${kx*40}px,${ky*40}px)`;
}
function touchStart(e){
  SND.init();SND.resume();
  for(const t of e.changedTouches){
    const isBtn=t.target.closest('.tbtn');
    if(isBtn)continue;
    if(t.clientX<window.innerWidth*0.45&&!tl.active){
      tl.active=true;tl.id=t.identifier;tl.ox=t.clientX;tl.oy=t.clientY;tl.x=0;tl.y=0;
      stkL.classList.add('on'); setStick(stkL,tl,0,0,0,0);
    }else if(t.clientX>=window.innerWidth*0.45&&!tr.active){
      tr.active=true;tr.id=t.identifier;tr.ox=t.clientX;tr.oy=t.clientY;tr.x=1;tr.y=0;
      stkR.classList.add('on'); setStick(stkR,tr,0,0,0,0);
      shooting=true;
    }
  }
}
function touchMove(e){
  for(const t of e.changedTouches){
    if(tl.active&&t.identifier===tl.id){
      let dx=t.clientX-tl.ox,dy=t.clientY-tl.oy;
      const l=Math.hypot(dx,dy)||1, m=Math.min(l,52)/52;
      tl.x=dx/l*m; tl.y=dy/l*m;
      setStick(stkL,tl,0,0,tl.x,tl.y);
    }
    if(tr.active&&t.identifier===tr.id){
      let dx=t.clientX-tr.ox,dy=t.clientY-tr.oy;
      const l=Math.hypot(dx,dy)||1;
      if(l>8){ tr.x=dx/l; tr.y=dy/l; }
      const m=Math.min(l,52)/52;
      setStick(stkR,tr,0,0,tr.x*m,tr.y*m);
    }
  }
  e.preventDefault();
}
function touchEnd(e){
  for(const t of e.changedTouches){
    if(tl.active&&t.identifier===tl.id){tl.active=false;tl.x=0;tl.y=0;stkL.classList.remove('on');}
    if(tr.active&&t.identifier===tr.id){tr.active=false;shooting=false;stkR.classList.remove('on');}
  }
}
addEventListener('touchstart',touchStart,{passive:false});
addEventListener('touchmove',touchMove,{passive:false});
addEventListener('touchend',touchEnd);
addEventListener('touchcancel',touchEnd);
const bind=(id,fn)=>{const el=document.getElementById(id);
  el.addEventListener('touchstart',ev=>{ev.preventDefault();ev.stopPropagation();fn();},{passive:false});
  el.addEventListener('click',ev=>{ev.preventDefault();fn();});};
bind('bDodge',()=>{if(state==='play')doDodge();});
bind('bReload',()=>{if(state==='play')startReload();});
bind('bSwap',()=>{if(state==='play')swapGun(1);});

/* ---------------- 메인 루프 ---------------- */
let last=performance.now();
function frame(now){
  const raw=Math.min((now-last)/1000,0.05); last=now;
  if(bannerT>0){ bannerT-=raw; if(bannerT<=0){
    const el=document.getElementById('waveBanner');
    el.style.opacity='0'; el.style.transform='translate(-50%,-50%) scale(.85)'; } }
  if(state==='play'){
    let dt=raw*timeScale;
    if(hitStop>0){ hitStop-=raw; dt=0; }
    update(dt);
  }else if(state==='dead'){
    timeScale=lerp(timeScale,.25,raw*2);
    update(raw*timeScale*0.3);
  }
  if(P)draw();
  requestAnimationFrame(frame);
}

/* ---------------- 시작 ---------------- */
resize();
buildWorld();
newRun();          // 배경이 바로 보이도록 월드 준비
state='title';
openTitle();
requestAnimationFrame(frame);
</script>
